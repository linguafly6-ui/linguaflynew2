name: A1 curriculum production CI

on:
  push:
    branches:
      - a1
    paths:
      - "content/canonical-missions/a1/**"
      - "schemas/course-mission.schema.json"
      - "scripts/validate-a1-curriculum.mjs"
      - "components/academy/CanonicalMission.tsx"
      - "app/academia/a1/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/academy-pilot-check.yml"
      - "app/api/auth/**"
      - "app/api/billing/**"
      - "app/api/repetition/**"
      - "app/api/learn/**"
      - "app/api/exercises/progress/**"
      - "app/api/progress/**"
      - "app/api/canonical-missions/**"
      - "components/SpacedRepetition.tsx"
      - "lib/student-auth.ts"
      - "lib/spaced-repetition.ts"
      - "lib/cf-context.ts"
  workflow_dispatch:
    inputs:
      require_all_missions:
        description: "Require all 100 A1 canonical missions (release gate)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: a1-curriculum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-check:
    name: Validate A1 001–100, type-check and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_ALL_MISSIONS: ${{ github.event.inputs.require_all_missions || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate every authored A1 mission against JSON Schema
        shell: bash
        run: |
          shopt -s nullglob
          files=(content/canonical-missions/a1/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No canonical A1 missions found."
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Validating $file"
            npx --yes ajv-cli@5 validate --spec=draft2020 -s schemas/course-mission.schema.json -d "$file"
          done

      - name: Check A1 mission range, sequence and learning structure
        run: node scripts/validate-a1-curriculum.mjs

      - name: Type-check application
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
