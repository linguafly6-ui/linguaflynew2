name: Academy + C2 continuous integration

on:
  push:
    branches:
      - work/linguafly-academy-audit
      - c2
    paths:
      - "app/academia/a1/001-canonical/**"
      - "app/academia/a2/**"
      - "app/academia/b1/**"
      - "app/academia/c2/**"
      - "app/academia/page.tsx"
      - "app/academia/pre-a1/**"
      - "components/academy/CanonicalMission.tsx"
      - "app/api/auth/**"
      - "app/api/billing/**"
      - "app/api/repetition/**"
      - "app/api/learn/**"
      - "app/api/exercises/progress/**"
      - "app/api/progress/**"
      - "app/api/canonical-missions/**"
      - "components/SpacedRepetition.tsx"
      - "migrations/d1/**"
      - "docs/course-architecture/**"
      - "lib/student-auth.ts"
      - "lib/spaced-repetition.ts"
      - "lib/cf-context.ts"
      - "content/canonical-missions/**"
      - "content/missions/pre-a1/**"
      - "schemas/course-mission.schema.json"
      - "scripts/validate_c2_missions.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/academy-pilot-check.yml"
  workflow_dispatch:
    inputs:
      require_all_c2_missions:
        description: "Require all 100 C2 mission files to exist"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: academy-c2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate all available C2 missions, types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate every C2 mission against the canonical schema
        run: |
          shopt -s nullglob
          missions=(content/canonical-missions/c2/[0-9][0-9][0-9].json)
          if [ "${#missions[@]}" -eq 0 ]; then
            echo "::error::No C2 mission JSON files found."
            exit 1
          fi
          for mission in "${missions[@]}"; do
            echo "Validating ${mission}"
            npx --yes ajv-cli@5 validate --spec=draft2020 -s schemas/course-mission.schema.json -d "${mission}"
          done

      - name: Check C2 numbering, eight sections and ten items per section
        env:
          C2_REQUIRE_ALL_MISSIONS: ${{ inputs.require_all_c2_missions || 'false' }}
        run: node scripts/validate_c2_missions.mjs

      - name: Type-check application
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
