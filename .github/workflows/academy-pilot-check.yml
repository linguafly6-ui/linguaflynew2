name: C2 course CI

on:
  push:
    branches:
      - c2
    paths:
      - "content/canonical-missions/c2/**"
      - "app/academia/c2/**"
      - "app/academia/page.tsx"
      - "components/academy/CanonicalMission.tsx"
      - "schemas/course-mission.schema.json"
      - "scripts/validate-c2-missions.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/academy-pilot-check.yml"
  workflow_dispatch:
    inputs:
      require_all:
        description: "Require all 100 C2 missions (final completeness check)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: c2-course-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c2-course:
    name: Validate all C2 missions, types and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REQUIRE_ALL_MISSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.require_all || 'false' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check C2 mission structure and item counts
        run: node scripts/validate-c2-missions.mjs

      - name: Validate every existing C2 mission against JSON Schema
        shell: bash
        run: |
          shopt -s nullglob
          missions=(content/canonical-missions/c2/[0-9][0-9][0-9].json)
          if (( ${#missions[@]} == 0 )); then
            echo "No C2 missions found."
            exit 1
          fi
          for mission in "${missions[@]}"; do
            echo "Validating ${mission}"
            npx --yes ajv-cli@5 validate --spec=draft2020 -s schemas/course-mission.schema.json -d "${mission}"
          done

      - name: Type-check application
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
