name: OpenNext build

concurrency:
  # PR validations are isolated from manual runs and never deploy to production.
  group: ${{ github.event_name == 'pull_request' && format('linguafly-pr-{0}', github.event.pull_request.number) || format('linguafly-manual-{0}', github.ref) }}
  cancel-in-progress: true
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
