name: OpenNext build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
      - name: Deploy to existing linguaflyapp1 Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a9369cb853d78201bfa11df775767f0f
      - name: Smoke-test production Worker routes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -u
          failed=0
          base="https://linguaflyapp1.lramlo2026.workers.dev"
          for path in \
            / \
            /blog \
            /blog/metodos \
            /blog/metodos/mejores-apps-ingles-gratis \
            /ejercicios \
            /ejercicios/a1 \
            /ejercicios/a1/1 \
            /curso-b2-speaking \
            /api/course/b2-speaking \
            /api/course/b2-speaking/1 \
            /api/exercises/courses \
            /api/exercises/a1/1 \
            /api/exercises/a2/1 \
            /api/exercises/b1/1 \
            /api/exercises/b2/1 \
            /api/exercises/c1/1 \
            /api/exercises/c2/1 \
            /api/exercises/audio/listening/a1/unit1/ex46.mp3 \
            /academia/b2/1
          do
            status=$(curl --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors -A "Mozilla/5.0 LinguaFly-SmokeTest" -o /tmp/linguafly-smoke.html -w "%{http_code}" "$base$path")
            echo "$status $base$path"
            if [ "$status" != "200" ]; then failed=1; fi
          done
          echo "Custom-domain diagnostic:"
          curl --silent --show-error --location --max-time 20 -o /dev/null -w "%{http_code} https://linguafly.app/\n" https://linguafly.app/ || true
          exit "$failed"
