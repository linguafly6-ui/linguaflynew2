name: OpenNext build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
      - name: Deploy to existing linguaflyapp1 Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a9369cb853d78201bfa11df775767f0f
      - name: Smoke-test production routes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          for url in \
            https://linguafly.app/ \
            https://linguafly.app/blog \
            https://linguafly.app/blog/metodos \
            https://linguafly.app/blog/metodos/mejores-apps-ingles-gratis \
            https://linguafly.app/academia/b2/1
          do
            status=$(curl --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/linguafly-smoke.html -w "%{http_code}" "$url")
            echo "$status $url"
            test "$status" = "200"
          done
