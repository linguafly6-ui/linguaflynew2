name: OpenNext build

concurrency:
  # PR validations are isolated from manual runs and never deploy to production.
  group: ${{ github.event_name == 'pull_request' && format('linguafly-pr-{0}', github.event.pull_request.number) || format('linguafly-manual-{0}', github.ref) }}
  cancel-in-progress: true
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
      - name: Deploy public Cloudflare Preview (PR #126 only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 126
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. Add a Cloudflare API token with Workers Scripts edit permission."
            exit 1
          fi
          npx wrangler preview --name a1-curriculum-pr-126 --message "A1 curriculum preview for PR #126" --ignore-base-config --json > preview-deployment.json
          cat preview-deployment.json
          PREVIEW_URL="$(node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("preview-deployment.json", "utf8"));
            const urls = [];
            const visit = (value) => {
              if (typeof value === "string" && /^https:\/\//.test(value) && value.includes("workers.dev")) urls.push(value);
              else if (Array.isArray(value)) value.forEach(visit);
              else if (value && typeof value === "object") Object.values(value).forEach(visit);
            };
            visit(data);
            const url = urls.find((value) => value.includes("a1-curriculum-pr-126-")) || urls[0];
            if (!url) process.exit(2);
            process.stdout.write(url);
          ')"
          echo "## Public Cloudflare Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "PR #126 preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a9369cb853d78201bfa11df775767f0f
