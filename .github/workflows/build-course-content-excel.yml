name: Build A1 and Pre-A1 content workbook

on:
  push:
    branches:
      - agent/a1-pre-a1-content-excel
    paths-ignore:
      - "artifacts/*.xlsx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-workbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/a1-pre-a1-content-excel
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook dependency
        run: pip install openpyxl
      - name: Build workbook from production mission files
        run: python scripts/build_a1_pre_a1_content_excel.py
      - name: Commit generated workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/A1_contenido_produccion_y_secciones_PreA1.xlsx
          if git diff --cached --quiet; then
            echo "Workbook is unchanged."
          else
            git commit -m "Generate A1 and Pre-A1 course content workbook"
            git push origin HEAD:agent/a1-pre-a1-content-excel
          fi
