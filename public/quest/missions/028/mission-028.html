<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linguafly 028 · Where Is It?</title>
<style>
:root{--ink:#203047;--muted:#64748b;--blue:#2764d8;--pale:#edf4ff;--green:#16834a;--red:#b42318}
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:900px;margin:0 auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.tag{color:#2457b7;font-weight:700;font-size:.82rem;letter-spacing:.04em}.progress{height:9px;background:#e3eaf4;border-radius:20px;overflow:hidden;margin:14px 0 24px}.bar{height:100%;width:0;background:#3978e8;transition:width .2s}
.panel{background:white;border:1px solid #e2e8f0;border-radius:20px;padding:clamp(18px,4vw,32px);box-shadow:0 8px 28px #19365b0c}
h1{font-size:clamp(1.7rem,4vw,2.3rem);margin:.2em 0}h2{font-size:1.3rem;margin:.3em 0 1em}.muted{color:var(--muted)}.scene{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;background:#f5f8fc;border-radius:16px;padding:22px;margin:18px 0;font-size:2.2rem;min-height:120px}.scene span{display:inline-flex;flex-direction:column;align-items:center;gap:3px}.scene small{font-size:.72rem;color:#64748b}.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:18px}
button{font:inherit;cursor:pointer;border:1px solid #cbd5e1;background:white;color:var(--ink);border-radius:12px;padding:13px 15px;font-weight:650}
button:hover{border-color:var(--blue);background:#f5f8ff}button:disabled{cursor:default;opacity:.8}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover{background:#1d4fb5;color:white}
.feedback{min-height:32px;margin-top:16px;font-weight:700}.good{color:var(--green)}.bad{color:var(--red)}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.pill{background:var(--pale);color:#2457b7;border-radius:999px;padding:5px 11px;font-size:.85rem;font-weight:700}
input{font:inherit;padding:12px;border:1px solid #bac7d8;border-radius:10px;width:min(100%,300px)}
.dragrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0}.drop{min-width:130px;min-height:64px;border:2px dashed #9eb1ca;border-radius:12px;padding:10px;text-align:center;background:#fafcff}
.choice{min-height:74px}.done{text-align:center;padding:28px}
@media(max-width:520px){main{padding:12px}.panel{border-radius:15px}.scene{font-size:1.8rem}}
</style>
</head>
<body><main>
<div class="top"><div><div class="tag">LINGUAFLY · PRE-A1 · MISIÓN 028</div><h1>Where Is It?</h1><div class="muted">¿Dónde está? Aprende a localizar objetos.</div></div><div class="pill" id="counter">Reto 1 de 20</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="panel" id="game"></section>
</main>
<script>
const $=s=>document.querySelector(s);
const vocab=['in','on','under','next to','behind','in front of'];
const tasks=[
{type:'mc',q:'The ball is inside the box. Where is the ball?',scene:[['⚽','ball'],['📦','box']],o:['under','in','behind'],a:'in'},
{type:'listen',q:'Escucha y elige la posición.',s:'The book is on the table.',scene:[['📘','book'],['🪑','table']],o:['on','under','in'],a:'on'},
{type:'visual',q:'Mira la escena. ¿Dónde está el gato?',scene:[['🪑','chair'],['🐱','cat debajo de la silla']],o:['behind','under','on'],a:'under'},
{type:'mc',q:'The cup is beside the plate. Where is the cup?',scene:[['☕','cup'],['🍽️','plate']],o:['next to','in','behind'],a:'next to'},
{type:'listen',q:'Escucha la frase y selecciona la preposición.',s:'The dog is behind the door.',scene:[['🐶','dog'],['🚪','door']],o:['in front of','behind','on'],a:'behind'},
{type:'pick',q:'Selecciona la frase que significa «El lápiz está delante del libro».',scene:[['✏️','pencil'],['📕','book']],o:['The pencil is behind the book.','The pencil is in front of the book.','The pencil is under the book.'],a:'The pencil is in front of the book.'},
{type:'mc',q:'The apple is inside the bag. Choose the correct word.',scene:[['🍎','apple'],['🎒','bag']],o:['in','on','next to'],a:'in'},
{type:'listen',q:'Escucha y elige dónde está la pelota.',s:'The ball is under the chair.',scene:[['⚽','ball'],['🪑','chair']],o:['on','under','behind'],a:'under'},
{type:'visual',q:'¿Dónde está el libro respecto a la caja?',scene:[['📦','box'],['📗','book encima de la caja']],o:['on','in','next to'],a:'on'},
{type:'pick',q:'Elige la frase correcta: la mochila está al lado de la silla.',scene:[['🎒','bag'],['🪑','chair']],o:['The bag is next to the chair.','The bag is in the chair.','The bag is behind the chair.'],a:'The bag is next to the chair.'},
{type:'mc',q:'The bird is in front of the house. Where is the bird?',scene:[['🐦','bird'],['🏠','house']],o:['behind','in front of','under'],a:'in front of'},
{type:'listen',q:'Escucha y selecciona la preposición.',s:'The toy is in the box.',scene:[['🧸','toy'],['📦','box']],o:['on','in','next to'],a:'in'},
{type:'classify',q:'¿Qué palabra indica que algo está debajo?',scene:[['🪑','chair'],['⚽','ball']],o:['under','behind','on'],a:'under'},
{type:'pick',q:'¿Qué frase significa «El gato está detrás de la caja»?',scene:[['🐱','cat'],['📦','box']],o:['The cat is behind the box.','The cat is in the box.','The cat is next to the box.'],a:'The cat is behind the box.'},
{type:'mc',q:'The phone is on the table. Choose the position.',scene:[['📱','phone'],['🪵','table']],o:['on','under','in front of'],a:'on'},
{type:'listen',q:'Escucha y responde.',s:'The girl is next to the tree.',scene:[['👧','girl'],['🌳','tree']],o:['next to','in','behind'],a:'next to'},
{type:'visual',q:'¿Dónde está el balón respecto a la caja?',scene:[['📦','box'],['⚽','ball delante de la caja']],o:['in','in front of','under'],a:'in front of'},
{type:'pick',q:'Selecciona la frase: «El perro está debajo de la mesa».',scene:[['🐶','dog'],['🪑','table']],o:['The dog is on the table.','The dog is under the table.','The dog is behind the table.'],a:'The dog is under the table.'},
{type:'listen',q:'Escucha con atención y elige la posición.',s:'The shoes are behind the door.',scene:[['👟','shoes'],['🚪','door']],o:['behind','next to','on'],a:'behind'},
{type:'review',q:'Completa la idea: The pencil is ___ the pencil case. (dentro)',scene:[['✏️','pencil'],['👝','pencil case']],o:['in','on','under'],a:'in'}
];
let index=0,score=0,answered=false;
function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sceneHTML(s){return s?'<div class="scene">'+s.map(x=>`<span>${x[0]}<small>${x[1]}</small></span>`).join('')+'</div>':''}
function say(t){if(!('speechSynthesis'in window)){alert('El audio no está disponible en este navegador.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.86;speechSynthesis.speak(u)}
function render(){
 answered=false;let t=tasks[index];$('#counter').textContent=`Reto ${index+1} de 20`;$('#bar').style.width=(index/20*100)+'%';
 let html=`<div class="tag">RETO ${index+1} · ${t.type==='listen'?'LISTENING':'PRACTICE'}</div><h2>${t.q}</h2>${sceneHTML(t.scene)}`;
 if(t.type==='listen')html+='<button id="play" type="button">▶ Repetir audio</button>';
 if(t.type==='classify')html+='<p class="muted">Piensa en la relación espacial que expresa cada palabra.</p>';
 html+='<div class="opts">'+shuffle(t.o).map(o=>`<button class="choice" type="button" data-answer="${encodeURIComponent(o)}">${o}</button>`).join('')+'</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><span class="muted">Elige una respuesta.</span><button class="primary" id="next" disabled>'+(index===19?'Ver resultado':'Siguiente')+'</button></div>';
 $('#game').innerHTML=html;
 const play=$('#play');if(play)play.onclick=()=>say(t.s);
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>check(b,decodeURIComponent(b.dataset.answer)===t.a,t.a));
 $('#next').onclick=()=>{if(index<19){index++;render()}else finish()};
}
function check(btn,ok,answer){if(answered)return;answered=true;document.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);let f=$('#feedback');if(ok){score++;f.textContent='¡Correcto!';f.className='feedback good'}else{f.textContent='No es esa. La respuesta correcta es: '+answer+'.';f.className='feedback bad'}$('#next').disabled=false}
function finish(){$('#bar').style.width='100%';$('#counter').textContent='Misión completada';$('#game').innerHTML=`<div class="done"><div style="font-size:3rem">📍</div><h2>¡Misión completada!</h2><p>Has terminado los 20 retos de <b>Where Is It?</b>.</p><p>Respuestas correctas: <b>${score} / 20</b></p><p class="muted">Repasa las preposiciones: in, on, under, next to, behind, in front of.</p><button class="primary" onclick="location.reload()">Volver a practicar</button></div>`}
render();
</script></body></html>
