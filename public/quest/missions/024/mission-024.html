<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linguafly · Misión 024 · Farm Friends</title>
<style>
:root{--ink:#293650;--muted:#6c7890;--blue:#547bd5;--line:#e5eaf2}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f4f9e9,#eef5ff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}main{max-width:1000px;margin:auto;padding:22px 16px 48px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.05em;color:#4d68a0}.tag{background:#eaf0fc;border-radius:99px;padding:7px 12px;font-size:.85rem}h1{font-size:clamp(2rem,5vw,3rem);margin:14px 0 4px}.sub{color:var(--muted);margin:0 0 18px}.panel{background:#fff;border:1px solid var(--line);border-radius:23px;padding:clamp(16px,3vw,25px);margin:16px 0;box-shadow:0 12px 34px #2936500c}h2{margin:0 0 8px}.hint{color:var(--muted);margin:0 0 14px}.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:10px}.tile{border:2px solid var(--line);border-radius:17px;background:#fffdfa;padding:12px;text-align:center;cursor:pointer;color:var(--ink)}.tile:hover,.tile:focus{border-color:var(--blue);outline:none}.emoji{font-size:2.5rem;display:block}.tile b{display:block;margin-top:5px}button{font:inherit}.primary,.secondary,.option{border:0;border-radius:14px;padding:12px 15px;cursor:pointer;font-weight:750}.primary{background:var(--blue);color:white}.secondary{background:#edf2fa;color:var(--ink)}.progress{height:9px;background:#edf1f7;border-radius:99px;overflow:hidden;margin:10px 0 16px}.bar{height:100%;width:0;background:linear-gradient(90deg,#648fe6,#65b89a);transition:width .2s}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.qnum{font-weight:850;color:#5a76b1}.prompt{font-size:1.2rem;font-weight:800;margin:14px 0}.visual{min-height:116px;border-radius:18px;background:linear-gradient(135deg,#f2f8e9,#f1f6ff);display:flex;align-items:center;justify-content:center;gap:14px;font-size:3.1rem;margin:12px 0;text-align:center;padding:12px;flex-wrap:wrap}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.option{background:#f1f5fb;color:var(--ink);border:2px solid transparent;min-height:60px}.option:hover{border-color:#91abe0}.option.correct{background:#e5f7ef;border-color:#58ad89}.option.wrong{background:#fff0f2;border-color:#df8fa1}.feedback{min-height:28px;font-weight:750;margin:12px 0}.good{color:#25835f}.bad{color:#b84d68}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.matchitem{border:2px solid var(--line);border-radius:13px;padding:12px;background:#f8faff;cursor:pointer;font-weight:750;min-height:60px}.matchitem.chosen{border-color:var(--blue);background:#eaf0ff}.matchitem.done{border-color:#69b68f;background:#e5f7ef}.soundbtn{display:inline-flex;align-items:center;gap:8px;background:#eaf0fc;border:0;border-radius:99px;padding:13px 18px;font-weight:800;cursor:pointer}.scene{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:100%;font-size:1rem}.scene div{background:#fff;border:1px solid #dfe8d5;border-radius:14px;padding:13px}.scene strong{display:block;font-size:1.5rem;margin-bottom:4px}.sentence{font-size:1.12rem;font-weight:850;background:#fff;border:1px solid #dfe8d5;border-radius:14px;padding:17px;width:100%;text-align:center}@media(max-width:520px){main{padding:14px 12px 35px}.panel{border-radius:18px}.prompt{font-size:1.05rem}.scene{grid-template-columns:1fr}}
</style></head><body><main>
<div class="top"><div class="brand">LINGUAFLY · PRE-A1</div><div class="tag">MISIÓN 024 / FARM FRIENDS</div></div>
<h1>Farm Friends 🚜</h1><p class="sub">Conoce la granja, sus lugares y los animales que viven allí.</p>
<section class="panel"><h2>🌾 Explora la granja</h2><p class="hint">Toca cada tarjeta para escuchar la palabra en inglés.</p><div class="vocab" id="vocab"></div></section>
<section class="panel"><div class="qhead"><h2>🎯 Tu reto</h2><span class="qnum" id="qnum">Reto 1 de 20</span></div><div class="progress"><div class="bar" id="bar"></div></div><p class="prompt" id="prompt"></p><div class="visual" id="visual"></div><div id="activity"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" id="repeat">🔊 Escuchar</button><button class="primary" id="next" disabled>Siguiente →</button></div></section>
</main><script>
const vocab=[{w:'farm',es:'granja',e:'🚜'},{w:'barn',es:'granero',e:'🏠'},{w:'field',es:'campo',e:'🌱'},{w:'farmer',es:'granjero/a',e:'🧑‍🌾'},{w:'cow',es:'vaca',e:'🐮'},{w:'sheep',es:'oveja',e:'🐑'},{w:'goat',es:'cabra',e:'🐐'},{w:'hen',es:'gallina',e:'🐔'}];
const $=id=>document.getElementById(id);function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u)}
$('vocab').innerHTML=vocab.map(x=>`<button class="tile" data-word="${x.w}"><span class="emoji">${x.e}</span><b>${x.w}</b><small>${x.es}</small></button>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>say(b.dataset.word));
const farmScene='<div class="scene"><div><strong>🏠</strong><b>Barn</b><br>🐮 Cow · 🐑 Sheep</div><div><strong>🌱</strong><b>Field</b><br>🐐 Goat</div><div><strong>🧑‍🌾</strong><b>Farmer</b><br>🚜 Farm</div><div><strong>🐔</strong><b>Hen</b><br>Near the barn</div></div>';
const qs=[
{t:'pick',p:'¿Qué palabra significa «granero»?',v:'🏠',a:'barn',o:['field','barn','farm']},
{t:'pick',p:'¿Qué animal ves?',v:'🐐',a:'goat',o:['sheep','hen','goat']},
{t:'listen',p:'Escucha y elige la palabra que oyes.',v:'🔊',s:'farmer',a:'farmer',o:['farmer','farm','field']},
{t:'pick',p:'¿Qué lugar es un campo?',v:'🌱',a:'field',o:['barn','field','farm']},
{t:'match',p:'Une cada imagen con su palabra.',v:'🔗',pairs:[['🚜','farm'],['🏠','barn'],['🌱','field'],['🧑‍🌾','farmer']]},
{t:'listen',p:'Escucha y elige el animal.',v:'🔊',s:'sheep',a:'sheep',o:['cow','sheep','goat']},
{t:'pick',p:'¿Qué animal ves?',v:'🐔',a:'hen',o:['hen','cow','sheep']},
{t:'there',p:'Lee la frase. ¿Qué lugar aparece en la imagen?',v:farmScene,sentence:'There is a barn.',a:'barn',o:['field','barn','farm']},
{t:'pick',p:'¿Quién trabaja en la granja?',v:'🧑‍🌾',a:'farmer',o:['farmer','hen','goat']},
{t:'listen',p:'Escucha y elige la palabra que oyes.',v:'🔊',s:'field',a:'field',o:['farm','field','barn']},
{t:'there',p:'Lee la frase. ¿Qué animal aparece?',v:farmScene,sentence:'There is a cow.',a:'cow',o:['goat','cow','hen']},
{t:'pick',p:'¿Qué animal ves?',v:'🐑',a:'sheep',o:['sheep','hen','cow']},
{t:'match',p:'Relaciona cada animal con su nombre.',v:'🐾',pairs:[['🐮','cow'],['🐑','sheep'],['🐐','goat'],['🐔','hen']]},
{t:'there',p:'Lee la frase. ¿Qué animal aparece?',v:farmScene,sentence:'There is a goat.',a:'goat',o:['sheep','hen','goat']},
{t:'listen',p:'Escucha y elige la palabra que oyes.',v:'🔊',s:'farm',a:'farm',o:['farm','farmer','barn']},
{t:'pick',p:'¿Qué lugar ves?',v:'🏠',a:'barn',o:['field','farm','barn']},
{t:'there',p:'Lee la frase. ¿Qué lugar aparece?',v:farmScene,sentence:'There is a field.',a:'field',o:['barn','field','farm']},
{t:'listen',p:'Escucha y elige el animal.',v:'🔊',s:'hen',a:'hen',o:['hen','sheep','cow']},
{t:'there',p:'Lee la frase. ¿Qué persona aparece?',v:farmScene,sentence:'There is a farmer.',a:'farmer',o:['farmer','goat','cow']},
{t:'sort',p:'Clasifica las palabras: ¿cuáles son animales?',v:'🐾',items:['farm','cow','barn','sheep','field','goat','farmer','hen'],a:['cow','sheep','goat','hen']}
];let qi=0,done=false;
function render(){done=false;$('next').disabled=true;$('feedback').textContent='';$('feedback').className='feedback';const q=qs[qi];$('qnum').textContent=`Reto ${qi+1} de 20`;$('bar').style.width=`${qi/20*100}%`;$('prompt').textContent=q.p;$('visual').innerHTML=q.v;$('activity').innerHTML='';$('repeat').disabled=!(q.s||q.sentence||q.t==='match');if(q.sentence)$('activity').innerHTML=`<div class="sentence">${q.sentence}</div>`;if(q.t==='match'){matchTask(q);return}if(q.t==='sort'){sortTask(q);return}if(q.t==='listen'){$('activity').innerHTML+='<button class="soundbtn" id="playSound">🔊 Repetir palabra</button>';$('playSound').onclick=()=>say(q.s)}if(q.t==='there')say(q.sentence);if(q.t==='listen')say(q.s);options(q.o,q.a)}
function options(opts,answer){const order=[...opts].sort(()=>Math.random()-.5);$('activity').innerHTML+='<div class="options">'+order.map(x=>`<button class="option">${x}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>check(b,b.textContent===answer,answer))}
function check(btn,ok,answer){if(done)return;done=true;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b===btn)b.classList.add(ok?'correct':'wrong')});$('feedback').textContent=ok?'¡Muy bien!':'Casi. La respuesta correcta era: '+answer;$('feedback').className='feedback '+(ok?'good':'bad');$('next').disabled=false}
function matchTask(q){$('activity').innerHTML='<p class="hint">Toca una tarjeta de la izquierda y después su pareja de la derecha.</p><div class="matchgrid" id="mg"></div>';let pairs=q.pairs,left=pairs.map(p=>({v:p[0],id:p[1],side:'l'})),right=[...pairs].sort(()=>Math.random()-.5).map(p=>({v:p[1],id:p[1],side:'r'}));let selected=null,count=0;[...left,...right].forEach(x=>{let b=document.createElement('button');b.className='matchitem';b.textContent=x.v;b.onclick=()=>{if(b.classList.contains('done'))return;if(!selected){selected={x,b};b.classList.add('chosen');return}if(selected.x.side!==x.side&&selected.x.id===x.id){selected.b.classList.remove('chosen');selected.b.classList.add('done');b.classList.add('done');count++;say(x.id);selected=null;if(count===pairs.length){done=true;$('feedback').textContent='¡Todas las parejas encontradas!';$('feedback').className='feedback good';$('next').disabled=false}}else{selected.b.classList.remove('chosen');selected=null}};$('mg').appendChild(b)})}
function sortTask(q){$('activity').innerHTML='<p class="hint">Selecciona solo los animales. Puedes tocar una tarjeta para marcarla o desmarcarla.</p><div class="options" id="sort"></div><button class="primary" id="checkSort" style="margin-top:12px">Comprobar</button>';let chosen=new Set();q.items.forEach(w=>{let b=document.createElement('button');b.className='option';b.textContent=w;b.onclick=()=>{if(chosen.has(w)){chosen.delete(w);b.classList.remove('correct')}else{chosen.add(w);b.classList.add('correct')}};$('sort').appendChild(b)});$('checkSort').onclick=()=>{if(done)return;done=true;let ok=chosen.size===q.a.length&&q.a.every(x=>chosen.has(x));$('feedback').textContent=ok?'¡Correcto! Has seleccionado los cuatro animales.':'Revisa la selección. Animales: cow, sheep, goat, hen.';$('feedback').className='feedback '+(ok?'good':'bad');$('next').disabled=false}}
$('repeat').onclick=()=>{const q=qs[qi];if(q.s)say(q.s);else if(q.sentence)say(q.sentence);else if(q.t==='match')say(q.pairs.map(x=>x[1]).join(', '));};$('next').onclick=()=>{if(qi<19){qi++;render()}else{$('qnum').textContent='¡Misión completada!';$('bar').style.width='100%';$('prompt').textContent='¡Has terminado Farm Friends!';$('visual').textContent='🚜 🏠 🌱 🧑‍🌾 🐮 🐑 🐐 🐔';$('activity').innerHTML='<p>Has practicado las palabras de la granja, sus lugares y animales, y has comprendido frases sencillas con “There is”.</p>';$('feedback').textContent='¡Buen trabajo!';$('next').disabled=true;$('repeat').disabled=true}};render();
</script></body></html>
