<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linguafly · Misión 023 · Animal Sounds</title>
<style>
:root{--ink:#293650;--muted:#6c7890;--blue:#547bd5;--line:#e5eaf2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f4f9e9,#eef5ff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
main{max-width:1000px;margin:auto;padding:22px 16px 48px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.05em;color:#4d68a0}.tag{background:#eaf0fc;border-radius:99px;padding:7px 12px;font-size:.85rem}
h1{font-size:clamp(2rem,5vw,3rem);margin:14px 0 4px}.sub{color:var(--muted);margin:0 0 18px}.panel{background:#fff;border:1px solid var(--line);border-radius:23px;padding:clamp(16px,3vw,25px);margin:16px 0;box-shadow:0 12px 34px #2936500c}
h2{margin:0 0 8px}.hint{color:var(--muted);margin:0 0 14px}.animals{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.animal{border:2px solid var(--line);border-radius:17px;background:#fffdfa;padding:12px;text-align:center;cursor:pointer;color:var(--ink)}.animal:hover,.animal:focus{border-color:var(--blue);outline:none}.emoji{font-size:2.65rem;display:block}.animal b{display:block;margin-top:5px}
button{font:inherit}.primary,.secondary,.option{border:0;border-radius:14px;padding:12px 15px;cursor:pointer;font-weight:750}.primary{background:var(--blue);color:white}.secondary{background:#edf2fa;color:var(--ink)}
.progress{height:9px;background:#edf1f7;border-radius:99px;overflow:hidden;margin:10px 0 16px}.bar{height:100%;width:0;background:linear-gradient(90deg,#648fe6,#65b89a);transition:width .2s}
.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.qnum{font-weight:850;color:#5a76b1}.prompt{font-size:1.2rem;font-weight:800;margin:14px 0}
.visual{min-height:116px;border-radius:18px;background:linear-gradient(135deg,#f2f8e9,#f1f6ff);display:flex;align-items:center;justify-content:center;gap:14px;font-size:3.3rem;margin:12px 0;text-align:center;padding:12px;flex-wrap:wrap}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.option{background:#f1f5fb;color:var(--ink);border:2px solid transparent;min-height:60px}.option:hover{border-color:#91abe0}.option.correct{background:#e5f7ef;border-color:#58ad89}.option.wrong{background:#fff0f2;border-color:#df8fa1}
.feedback{min-height:28px;font-weight:750;margin:12px 0}.good{color:#25835f}.bad{color:#b84d68}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.matchitem{border:2px solid var(--line);border-radius:13px;padding:12px;background:#f8faff;cursor:pointer;font-weight:750;min-height:60px}.matchitem.chosen{border-color:var(--blue);background:#eaf0ff}.matchitem.done{border-color:#69b68f;background:#e5f7ef}
.soundbtn{display:inline-flex;align-items:center;gap:8px;background:#eaf0fc;border:0;border-radius:99px;padding:13px 18px;font-weight:800;cursor:pointer}
@media(max-width:520px){main{padding:14px 12px 35px}.panel{border-radius:18px}.prompt{font-size:1.05rem}}
</style></head><body><main>
<div class="top"><div class="brand">LINGUAFLY · PRE-A1</div><div class="tag">MISIÓN 023 / ANIMAL SOUNDS</div></div>
<h1>Animal Sounds 🐮</h1><p class="sub">Descubre animales, escucha sus sonidos y responde a “What is it?”.</p>
<section class="panel"><h2>🌾 Explora los animales</h2><p class="hint">Toca cada animal para escuchar su nombre en inglés. En la vaca y el pato también puedes escuchar su sonido.</p><div class="animals" id="animals"></div></section>
<section class="panel"><div class="qhead"><h2>🎯 Tu reto</h2><span class="qnum" id="qnum">Reto 1 de 20</span></div><div class="progress"><div class="bar" id="bar"></div></div><p class="prompt" id="prompt"></p><div class="visual" id="visual"></div><div id="activity"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" id="repeat">🔊 Escuchar</button><button class="primary" id="next" disabled>Siguiente →</button></div></section>
</main>
<script>
const animals=[
{w:'cow',es:'vaca',e:'🐮',sound:'moo'},
{w:'sheep',es:'oveja',e:'🐑'},
{w:'duck',es:'pato',e:'🦆',sound:'quack'},
{w:'horse',es:'caballo',e:'🐴'},
{w:'pig',es:'cerdo',e:'🐷'},
{w:'chicken',es:'gallina',e:'🐔'}
];
const $=id=>document.getElementById(id);
function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u)}
$('animals').innerHTML=animals.map(a=>`<button class="animal" data-animal="${a.w}"><span class="emoji">${a.e}</span><b>${a.w}</b><small>${a.es}</small></button>`).join('');
document.querySelectorAll('.animal').forEach(b=>b.onclick=()=>{const a=animals.find(x=>x.w===b.dataset.animal);say(a.w)});
const qs=[
{t:'image',p:'¿Qué animal ves?',v:'🐮',a:'cow',o:['cow','sheep','pig']},
{t:'sound',p:'Escucha el sonido. ¿Qué animal lo hace?',v:'🔊',sound:'moo',a:'cow',o:['cow','duck','horse']},
{t:'image',p:'¿Qué animal ves?',v:'🦆',a:'duck',o:['duck','chicken','sheep']},
{t:'what',p:'What is it?',v:'🐴',a:'horse',o:['horse','cow','pig']},
{t:'sound',p:'Escucha el sonido. ¿Qué animal lo hace?',v:'🔊',sound:'quack',a:'duck',o:['duck','cow','chicken']},
{t:'image',p:'¿Qué animal ves?',v:'🐑',a:'sheep',o:['sheep','horse','chicken']},
{t:'what',p:'What is it?',v:'🐷',a:'pig',o:['pig','duck','cow']},
{t:'match',p:'Une cada animal con su nombre en inglés.',v:'🔗',pairs:[['🐮','cow'],['🐑','sheep'],['🦆','duck'],['🐴','horse']]},
{t:'image',p:'¿Qué animal ves?',v:'🐔',a:'chicken',o:['chicken','pig','duck']},
{t:'sound',p:'Escucha el sonido. ¿Qué animal lo hace?',v:'🔊',sound:'moo',a:'cow',o:['cow','horse','sheep']},
{t:'what',p:'What is it?',v:'🦆',a:'duck',o:['duck','chicken','pig']},
{t:'image',p:'¿Qué animal ves?',v:'🐷',a:'pig',o:['pig','cow','horse']},
{t:'sound',p:'Escucha el sonido. ¿Qué animal lo hace?',v:'🔊',sound:'quack',a:'duck',o:['duck','sheep','cow']},
{t:'what',p:'What is it?',v:'🐔',a:'chicken',o:['chicken','sheep','horse']},
{t:'match',p:'Relaciona cada sonido con el animal correspondiente.',v:'🎧',pairs:[['🔊 moo','cow'],['🔊 quack','duck']]},
{t:'image',p:'¿Qué animal ves?',v:'🐴',a:'horse',o:['horse','pig','sheep']},
{t:'what',p:'What is it?',v:'🐮',a:'cow',o:['cow','chicken','duck']},
{t:'sound',p:'Escucha el sonido. ¿Qué animal lo hace?',v:'🔊',sound:'moo',a:'cow',o:['cow','duck','pig']},
{t:'image',p:'¿Qué animal ves?',v:'🐑',a:'sheep',o:['sheep','chicken','horse']},
{t:'what',p:'What is it?',v:'🐷',a:'pig',o:['pig','cow','duck']}
];
let qi=0,done=false;
function render(){
 done=false;$('next').disabled=true;$('feedback').textContent='';$('feedback').className='feedback';
 const q=qs[qi];$('qnum').textContent=`Reto ${qi+1} de 20`;$('bar').style.width=`${qi/20*100}%`;$('prompt').textContent=q.p;$('visual').textContent=q.v;$('activity').innerHTML='';
 if(q.t==='match'){matchTask(q);return}
 if(q.t==='sound'){say(q.sound);$('activity').innerHTML='<button class="soundbtn" id="playSound">🔊 Repetir sonido</button>';$('playSound').onclick=()=>say(q.sound)}
 options(q.o,q.a);
}
function options(opts,answer){
 const order=[...opts].sort(()=>Math.random()-.5);
 $('activity').innerHTML+='<div class="options">'+order.map(x=>`<button class="option">${x}</button>`).join('')+'</div>';
 document.querySelectorAll('.option').forEach(b=>b.onclick=()=>check(b,b.textContent===answer,answer));
}
function check(btn,ok,answer){
 if(done)return;done=true;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b===btn)b.classList.add(ok?'correct':'wrong')});
 $('feedback').textContent=ok?'¡Muy bien!':'Casi. La respuesta correcta era: '+answer;$('feedback').className='feedback '+(ok?'good':'bad');$('next').disabled=false;
}
function matchTask(q){
 $('activity').innerHTML='<p class="hint">Toca una tarjeta de la izquierda y después su pareja de la derecha.</p><div class="matchgrid" id="mg"></div>';
 let pairs=q.pairs,left=pairs.map(p=>({v:p[0],id:p[1],side:'l'})),right=[...pairs].sort(()=>Math.random()-.5).map(p=>({v:p[1],id:p[1],side:'r'}));
 let selected=null,count=0;
 [...left,...right].forEach(x=>{let b=document.createElement('button');b.className='matchitem';b.textContent=x.v;b.onclick=()=>{if(b.classList.contains('done'))return;if(!selected){selected={x,b};b.classList.add('chosen');return}if(selected.x.side!==x.side&&selected.x.id===x.id){selected.b.classList.remove('chosen');selected.b.classList.add('done');b.classList.add('done');count++;say(x.id);selected=null;if(count===pairs.length){done=true;$('feedback').textContent='¡Todas las parejas encontradas!';$('feedback').className='feedback good';$('next').disabled=false}}else{selected.b.classList.remove('chosen');selected=null}};$('mg').appendChild(b)});
}
$('repeat').onclick=()=>{let q=qs[qi];if(q.t==='sound')say(q.sound);else if(q.t==='what')say('What is it?');else if(q.t==='match')say(q.pairs.map(x=>x[1]).join(', '));else say('What is it?')};
$('next').onclick=()=>{if(qi<19){qi++;render()}else{$('qnum').textContent='¡Misión completada!';$('bar').style.width='100%';$('prompt').textContent='¡Has terminado Animal Sounds!';$('visual').textContent='🐮🐑🦆🐴🐷🐔';$('activity').innerHTML='<p>Has relacionado imágenes, sonidos y nombres de animales, y has practicado la pregunta “What is it?”.</p>';$('feedback').textContent='¡Buen trabajo!';$('next').disabled=true;$('repeat').disabled=true}};
render();
</script></body></html>
