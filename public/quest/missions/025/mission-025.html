<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linguafly · Misión 025 · Under the Sea</title><style>
:root{--ink:#20344d;--muted:#657991;--blue:#267ca8;--line:#dce8ef}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e8f8fb,#edf1ff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}main{max-width:980px;margin:auto;padding:22px 16px 48px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.05em;color:#286e91}.tag{background:#e0f2f8;border-radius:99px;padding:7px 12px;font-size:.85rem}h1{font-size:clamp(2rem,5vw,3rem);margin:14px 0 4px}.sub{color:var(--muted);margin:0 0 18px}.panel{background:#fff;border:1px solid var(--line);border-radius:23px;padding:clamp(16px,3vw,25px);margin:16px 0;box-shadow:0 12px 34px #20344d0c}h2{margin:0 0 8px}.hint{color:var(--muted);margin:0 0 14px}.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.tile{border:2px solid var(--line);border-radius:17px;background:#fbfeff;padding:12px;text-align:center;cursor:pointer;color:var(--ink)}.tile:hover,.tile:focus{border-color:var(--blue);outline:none}.emoji{font-size:2.5rem;display:block}.tile b{display:block;margin-top:5px}button{font:inherit}.primary,.secondary,.option{border:0;border-radius:14px;padding:12px 15px;cursor:pointer;font-weight:750}.primary{background:var(--blue);color:white}.secondary{background:#edf3f8;color:var(--ink)}.progress{height:9px;background:#edf1f7;border-radius:99px;overflow:hidden;margin:10px 0 16px}.bar{height:100%;width:0;background:linear-gradient(90deg,#3898bd,#64b9a4);transition:width .2s}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.qnum{font-weight:850;color:#367fa0}.prompt{font-size:1.2rem;font-weight:800;margin:14px 0}.visual{min-height:125px;border-radius:18px;background:linear-gradient(135deg,#e8f8fb,#f1f5ff);display:flex;align-items:center;justify-content:center;gap:14px;font-size:3.4rem;margin:12px 0;text-align:center;padding:12px;flex-wrap:wrap}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.option{background:#f1f6fa;color:var(--ink);border:2px solid transparent;min-height:60px}.option:hover{border-color:#91c2d7}.option.correct{background:#e5f7ef;border-color:#58ad89}.option.wrong{background:#fff0f2;border-color:#df8fa1}.feedback{min-height:28px;font-weight:750;margin:12px 0}.good{color:#25835f}.bad{color:#b84d68}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.matchitem{border:2px solid var(--line);border-radius:13px;padding:12px;background:#f8fcff;cursor:pointer;font-weight:750;min-height:60px}.matchitem.chosen{border-color:var(--blue);background:#eaf6ff}.matchitem.done{border-color:#69b68f;background:#e5f7ef}.soundbtn{display:inline-flex;align-items:center;gap:8px;background:#eaf0fc;border:0;border-radius:99px;padding:13px 18px;font-weight:800;cursor:pointer}.trait{font-size:1rem;background:#fff;border:1px solid #d8e7ef;border-radius:14px;padding:14px;width:100%;text-align:center;font-weight:800}.mini{font-size:.9rem;color:var(--muted)}@media(max-width:520px){main{padding:14px 12px 35px}.panel{border-radius:18px}.prompt{font-size:1.05rem}}
</style></head><body><main><div class="top"><div class="brand">LINGUAFLY · PRE-A1</div><div class="tag">MISIÓN 025 / UNDER THE SEA</div></div><h1>Under the Sea 🌊</h1><p class="sub">Explora el mar e identifica siete animales por su aspecto.</p>
<section class="panel"><h2>🐠 Explora los animales marinos</h2><p class="hint">Toca cada tarjeta para escuchar su nombre en inglés.</p><div class="vocab" id="vocab"></div></section>
<section class="panel"><div class="qhead"><h2>🎯 Tu reto</h2><span class="qnum" id="qnum">Reto 1 de 20</span></div><div class="progress"><div class="bar" id="bar"></div></div><p class="prompt" id="prompt"></p><div class="visual" id="visual"></div><div id="activity"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" id="repeat">🔊 Escuchar</button><button class="primary" id="next" disabled>Siguiente →</button></div></section></main>
<script>
const vocab=[{w:'fish',es:'pez',e:'🐟'},{w:'shark',es:'tiburón',e:'🦈'},{w:'whale',es:'ballena',e:'🐋'},{w:'dolphin',es:'delfín',e:'🐬'},{w:'octopus',es:'pulpo',e:'🐙'},{w:'crab',es:'cangrejo',e:'🦀'},{w:'turtle',es:'tortuga',e:'🐢'}];
const $=id=>document.getElementById(id);function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u)}
$('vocab').innerHTML=vocab.map(x=>`<button class="tile" data-word="${x.w}"><span class="emoji">${x.e}</span><b>${x.w}</b><small>${x.es}</small></button>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>say(b.dataset.word));
const qs=[
{t:'pick',p:'¿Qué animal marino aparece en la imagen?',v:'🐟',a:'fish',o:['fish','crab','turtle']},
{t:'trait',p:'¿Qué animal tiene una gran aleta dorsal y una boca llena de dientes?',v:'🌊 🫧',trait:'Aleta dorsal grande · dientes afilados',a:'shark',o:['dolphin','shark','whale']},
{t:'listen',p:'Escucha el nombre y selecciónalo.',v:'🔊',s:'whale',a:'whale',o:['whale','fish','shark']},
{t:'pick',p:'¿Qué animal tiene ocho brazos?',v:'🐙',a:'octopus',o:['crab','octopus','turtle']},
{t:'match',p:'Une cada animal con su nombre en inglés.',v:'🔗',pairs:[['🐬','dolphin'],['🐢','turtle'],['🦀','crab'],['🐋','whale']]},
{t:'trait',p:'¿Qué animal tiene un caparazón?',v:'🌊 🫧',trait:'Caparazón duro · cuatro aletas',a:'turtle',o:['turtle','fish','dolphin']},
{t:'listen',p:'Escucha el nombre y selecciónalo.',v:'🔊',s:'crab',a:'crab',o:['shark','crab','octopus']},
{t:'pick',p:'¿Qué animal tiene dos pinzas?',v:'🦀',a:'crab',o:['crab','whale','fish']},
{t:'odd',p:'Encuentra el animal diferente: el único mamífero marino de este grupo que es enorme.',v:'🌊 🫧',a:'whale',o:['whale','crab','fish']},
{t:'listen',p:'Escucha el nombre y selecciónalo.',v:'🔊',s:'dolphin',a:'dolphin',o:['dolphin','turtle','shark']},
{t:'match',p:'Relaciona las imágenes con sus nombres.',v:'🐾',pairs:[['🐟','fish'],['🦈','shark'],['🐙','octopus']]},
{t:'trait',p:'¿Qué animal tiene un cuerpo alargado y ocho brazos con ventosas?',v:'🌊 🫧',trait:'Ocho brazos · ventosas',a:'octopus',o:['octopus','crab','whale']},
{t:'pick',p:'¿Qué animal tiene una aleta caudal y suele saltar fuera del agua?',v:'🐬',a:'dolphin',o:['dolphin','shark','turtle']},
{t:'listen',p:'Escucha el nombre y selecciónalo.',v:'🔊',s:'turtle',a:'turtle',o:['fish','turtle','crab']},
{t:'trait',p:'¿Qué animal es muy grande y respira aire en la superficie?',v:'🌊 🫧',trait:'Gran tamaño · sale a la superficie para respirar',a:'whale',o:['whale','dolphin','shark']},
{t:'pick',p:'¿Qué animal tiene branquias y aletas?',v:'🐟',a:'fish',o:['fish','octopus','crab']},
{t:'listen',p:'Escucha el nombre y selecciónalo.',v:'🔊',s:'shark',a:'shark',o:['shark','whale','dolphin']},
{t:'odd',p:'¿Cuál de estos animales tiene pinzas?',v:'🌊 🫧',a:'crab',o:['turtle','crab','fish']},
{t:'match',p:'Une las últimas imágenes con sus nombres.',v:'🔗',pairs:[['🦈','shark'],['🐙','octopus'],['🐋','whale'],['🐢','turtle']]},
{t:'sort',p:'Selecciona los tres animales que tienen caparazón, pinzas o brazos.',v:'🌊 🫧',items:['fish','crab','whale','octopus','shark','turtle'],a:['crab','octopus','turtle']}
];let qi=0,done=false;
function render(){done=false;$('next').disabled=true;$('feedback').textContent='';$('feedback').className='feedback';const q=qs[qi];$('qnum').textContent=`Reto ${qi+1} de 20`;$('bar').style.width=`${qi/20*100}%`;$('prompt').textContent=q.p;$('visual').textContent=q.v;$('activity').innerHTML='';$('repeat').disabled=!(q.s||q.t==='match');if(q.t==='trait')$('activity').innerHTML=`<div class="trait">${q.trait}</div>`;if(q.t==='listen'){$('activity').innerHTML='<button class="soundbtn" id="playSound">🔊 Repetir palabra</button>';$('playSound').onclick=()=>say(q.s)}if(q.t==='match'){matchTask(q);return}if(q.t==='sort'){sortTask(q);return}if(q.t==='listen')say(q.s);options(q.o,q.a)}
function options(opts,answer){const order=[...opts].sort(()=>Math.random()-.5);$('activity').innerHTML+='<div class="options">'+order.map(x=>`<button class="option">${x}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>check(b,b.textContent===answer,answer))}
function check(btn,ok,answer){if(done)return;done=true;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b===btn)b.classList.add(ok?'correct':'wrong')});$('feedback').textContent=ok?'¡Muy bien!':'La respuesta correcta era: '+answer;$('feedback').className='feedback '+(ok?'good':'bad');$('next').disabled=false}
function matchTask(q){$('activity').innerHTML='<p class="hint">Toca una tarjeta de imagen y después su pareja con el nombre.</p><div class="matchgrid" id="mg"></div>';let pairs=q.pairs,left=pairs.map(p=>({v:p[0],id:p[1],side:'l'})),right=[...pairs].sort(()=>Math.random()-.5).map(p=>({v:p[1],id:p[1],side:'r'}));let selected=null,count=0;[...left,...right].forEach(x=>{let b=document.createElement('button');b.className='matchitem';b.textContent=x.v;b.onclick=()=>{if(b.classList.contains('done'))return;if(!selected){selected={x,b};b.classList.add('chosen');return}if(selected.x.side!==x.side&&selected.x.id===x.id){selected.b.classList.remove('chosen');selected.b.classList.add('done');b.classList.add('done');count++;say(x.id);selected=null;if(count===pairs.length){done=true;$('feedback').textContent='¡Todas las parejas encontradas!';$('feedback').className='feedback good';$('next').disabled=false}}else{selected.b.classList.remove('chosen');selected=null}};$('mg').appendChild(b)})}
function sortTask(q){$('activity').innerHTML='<p class="hint">Marca las tres palabras que corresponden a los animales descritos.</p><div class="options" id="sort"></div><button class="primary" id="checkSort" style="margin-top:12px">Comprobar</button>';let chosen=new Set();q.items.sort(()=>Math.random()-.5).forEach(w=>{let b=document.createElement('button');b.className='option';b.textContent=w;b.onclick=()=>{if(chosen.has(w)){chosen.delete(w);b.classList.remove('correct')}else{chosen.add(w);b.classList.add('correct')}};$('sort').appendChild(b)});$('checkSort').onclick=()=>{if(done)return;done=true;let ok=chosen.size===q.a.length&&q.a.every(x=>chosen.has(x));$('feedback').textContent=ok?'¡Correcto!':'Las respuestas son: crab, octopus y turtle.';$('feedback').className='feedback '+(ok?'good':'bad');$('next').disabled=false}}
$('repeat').onclick=()=>{const q=qs[qi];if(q.s)say(q.s);else if(q.t==='match')say(q.pairs.map(x=>x[1]).join(', '))};$('next').onclick=()=>{if(qi<19){qi++;render()}else{$('qnum').textContent='¡Misión completada!';$('bar').style.width='100%';$('prompt').textContent='¡Has terminado Under the Sea!';$('visual').textContent='🐟 🦈 🐋 🐬 🐙 🦀 🐢';$('activity').innerHTML='<p>Has identificado los siete animales marinos y reconocido sus características visuales.</p>';$('feedback').textContent='¡Buen trabajo!';$('next').disabled=true;$('repeat').disabled=true}};render();
</script></body></html>
