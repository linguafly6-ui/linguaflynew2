<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linguafly · Misión 027 · At the Zoo</title><style>
:root{--ink:#24364b;--muted:#667b8e;--green:#347d62;--line:#dce9df}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf9ed,#f4f3ff);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}main{max-width:980px;margin:auto;padding:22px 16px 48px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:.05em;color:#347d62}.tag{background:#e2f2e6;border-radius:99px;padding:7px 12px;font-size:.85rem}h1{font-size:clamp(2rem,5vw,3rem);margin:14px 0 4px}.sub{color:var(--muted);margin:0 0 18px}.panel{background:#fff;border:1px solid var(--line);border-radius:23px;padding:clamp(16px,3vw,25px);margin:16px 0;box-shadow:0 12px 34px #20344d0c}h2{margin:0 0 8px}.hint{color:var(--muted);margin:0 0 14px}.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}.tile,.option,.matchitem{font:inherit;cursor:pointer}.tile{border:2px solid var(--line);border-radius:17px;background:#fbfffb;padding:12px;text-align:center;color:var(--ink)}.tile:hover,.tile:focus{border-color:var(--green)}.emoji{font-size:2.5rem;display:block}.tile b{display:block;margin-top:5px}button{font:inherit}.primary,.secondary,.option{border:0;border-radius:14px;padding:12px 15px;cursor:pointer;font-weight:750}.primary{background:var(--green);color:white}.secondary{background:#edf3f0;color:var(--ink)}.progress{height:9px;background:#edf1f7;border-radius:99px;overflow:hidden;margin:10px 0 16px}.bar{height:100%;width:0;background:linear-gradient(90deg,#55a77b,#a2c96c);transition:width .2s}.qhead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.qnum{font-weight:850;color:var(--green)}.prompt{font-size:1.2rem;font-weight:800;margin:14px 0}.visual{min-height:125px;border-radius:18px;background:linear-gradient(135deg,#e9f7e9,#f4f5ff);display:flex;align-items:center;justify-content:center;gap:14px;font-size:3.2rem;margin:12px 0;text-align:center;padding:12px;flex-wrap:wrap}.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.option{background:#f1f6f2;color:var(--ink);border:2px solid transparent;min-height:60px}.option:hover{border-color:#9bc6a8}.option.correct{background:#e5f7ef;border-color:#58ad89}.option.wrong{background:#fff0f2;border-color:#df8fa1}.feedback{min-height:28px;font-weight:750;margin:12px 0}.good{color:#25835f}.bad{color:#b84d68}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.matchitem{border:2px solid var(--line);border-radius:13px;padding:12px;background:#f8fcf8;font-weight:750;min-height:60px}.matchitem.chosen{border-color:var(--green);background:#eaf6ed}.matchitem.done{border-color:#69b68f;background:#e5f7ef}.soundbtn{display:inline-flex;align-items:center;gap:8px;background:#eaf4eb;border:0;border-radius:99px;padding:13px 18px;font-weight:800;cursor:pointer}.mini{font-size:.9rem;color:var(--muted)}@media(max-width:520px){main{padding:14px 12px 35px}.panel{border-radius:18px}.prompt{font-size:1.05rem}}
</style></head><body><main><div class="top"><div class="brand">LINGUAFLY · PRE-A1</div><div class="tag">MISIÓN 027 / AT THE ZOO</div></div><h1>At the Zoo 🦁</h1><p class="sub">Descubre animales salvajes, reconoce sus imágenes y relaciónalos con los lugares donde viven.</p><section class="panel"><h2>🦓 Conoce a los animales</h2><p class="hint">Toca una tarjeta para escuchar el nombre en inglés.</p><div class="vocab" id="vocab"></div></section><section class="panel"><div class="qhead"><h2>🔎 Tu visita al zoo</h2><span class="qnum" id="qnum">Reto 1 de 20</span></div><div class="progress"><div class="bar" id="bar"></div></div><p class="prompt" id="prompt"></p><div class="visual" id="visual"></div><div id="activity"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="actions"><button class="secondary" id="repeat">🔊 Escuchar</button><button class="primary" id="next" disabled>Siguiente →</button></div></section></main><script>
const vocab=[{w:'lion',es:'león',e:'🦁'},{w:'tiger',es:'tigre',e:'🐯'},{w:'elephant',es:'elefante',e:'🐘'},{w:'giraffe',es:'jirafa',e:'🦒'},{w:'monkey',es:'mono',e:'🐒'},{w:'zebra',es:'cebra',e:'🦓'},{w:'bear',es:'oso',e:'🐻'}];
const $=id=>document.getElementById(id);function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u)}
$('vocab').innerHTML=vocab.map(x=>`<button class="tile" data-word="${x.w}"><span class="emoji">${x.e}</span><b>${x.w}</b><small>${x.es}</small></button>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>say(b.dataset.word));
const qs=[
{t:'image',p:'¿Qué animal aparece en la imagen?',v:'🦁',a:'lion',o:['tiger','lion','bear']},
{t:'listen',p:'Escucha el nombre y selecciónalo.',v:'🔊',s:'elephant',a:'elephant',o:['elephant','zebra','monkey']},
{t:'image',p:'Identifica este animal.',v:'🦒',a:'giraffe',o:['giraffe','lion','tiger']},
{t:'habitat',p:'¿Qué animal encaja con este entorno?',v:'🌳 🌿 🌴 🐒',a:'monkey',o:['monkey','zebra','elephant']},
{t:'match',p:'Une cada imagen con su nombre en inglés.',v:'🔗',pairs:[['🐘','elephant'],['🐯','tiger'],['🐻','bear']]},
{t:'listen',p:'Escucha la palabra y encuentra la imagen.',v:'🔊',s:'zebra',a:'zebra',o:['🦓 zebra','🦒 giraffe','🦁 lion']},
{t:'image',p:'¿Cuál de estos animales ves?',v:'🐻',a:'bear',o:['bear','monkey','tiger']},
{t:'habitat',p:'Este paisaje abierto tiene hierba y pocos árboles. ¿Qué animal se asocia con él?',v:'🌾 🌿 🌳',a:'zebra',o:['zebra','monkey','bear']},
{t:'listen',p:'Escucha y selecciona el animal correcto.',v:'🔊',s:'lion',a:'lion',o:['giraffe','lion','elephant']},
{t:'match',p:'Relaciona cada imagen con su nombre.',v:'🐾',pairs:[['🦁','lion'],['🦒','giraffe'],['🐒','monkey']]},
{t:'image',p:'Observa la imagen y elige el nombre.',v:'🐯',a:'tiger',o:['tiger','bear','zebra']},
{t:'habitat',p:'¿Qué animal se asocia con este paisaje de árboles?',v:'🌳 🌴 🍃',a:'monkey',o:['monkey','lion','zebra']},
{t:'listen',p:'Escucha el nombre en inglés.',v:'🔊',s:'giraffe',a:'giraffe',o:['bear','giraffe','tiger']},
{t:'image',p:'¿Qué animal tiene una trompa larga?',v:'🐘',a:'elephant',o:['elephant','lion','monkey']},
{t:'habitat',p:'¿Qué animal encaja con este paisaje frío y rocoso?',v:'🪨 ❄️ 🏔️',a:'bear',o:['bear','giraffe','zebra']},
{t:'listen',p:'Escucha la instrucción y elige el animal.',v:'🔊',s:'Find the tiger.',a:'tiger',o:['tiger','monkey','elephant']},
{t:'classify',p:'Selecciona los dos animales con rayas visibles.',v:'🐾',items:['zebra','tiger','bear','lion','giraffe','elephant'],a:['zebra','tiger']},
{t:'match',p:'Une las imágenes con sus nombres.',v:'🔗',pairs:[['🦓','zebra'],['🐻','bear'],['🐘','elephant']]},
{t:'listen',p:'Escucha y selecciona el nombre correcto.',v:'🔊',s:'monkey',a:'monkey',o:['monkey','giraffe','lion']},
{t:'classify',p:'Selecciona los tres animales de cuello largo, trompa o gran tamaño corporal que se muestran en las tarjetas.',v:'🦒 🐘 🦁 🐯 🐻 🦓',items:['giraffe','elephant','lion','tiger','bear','zebra'],a:['giraffe','elephant']}
];let qi=0,done=false;
function render(){done=false;$('next').disabled=true;$('feedback').textContent='';$('feedback').className='feedback';const q=qs[qi];$('qnum').textContent=`Reto ${qi+1} de 20`;$('bar').style.width=`${qi/20*100}%`;$('prompt').textContent=q.p;$('visual').textContent=q.v;$('activity').innerHTML='';$('repeat').disabled=!(q.s||q.t==='match');if(q.t==='listen'){$('activity').innerHTML='<button class="soundbtn" id="playSound">🔊 Repetir audio</button>';options(q.o,q.a);$('playSound').onclick=()=>say(q.s)}else if(q.t==='match'){matchTask(q)}else if(q.t==='classify'){classifyTask(q)}else{options(q.o,q.a)}}
function options(opts,answer){const order=[...opts].sort(()=>Math.random()-.5);$('activity').innerHTML+='<div class="options">'+order.map(x=>`<button class="option">${x}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>check(b,b.textContent.trim().endsWith(answer),answer))}
function check(btn,ok,answer){if(done)return;done=true;document.querySelectorAll('.option').forEach(b=>{b.disabled=true;if(b===btn)b.classList.add(ok?'correct':'wrong')});$('feedback').textContent=ok?'¡Muy bien!':`La respuesta correcta era: ${answer}`;$('feedback').className='feedback '+(ok?'good':'bad');$('next').disabled=false}
function matchTask(q){$('activity').innerHTML='<p class="hint">Toca una imagen y después su pareja con el nombre.</p><div class="matchgrid" id="mg"></div>';let pairs=q.pairs,left=pairs.map(p=>({v:p[0],id:p[1],side:'l'})),right=[...pairs].sort(()=>Math.random()-.5).map(p=>({v:p[1],id:p[1],side:'r'}));let selected=null,count=0;[...left,...right].forEach(x=>{let b=document.createElement('button');b.className='matchitem';b.textContent=x.v;b.onclick=()=>{if(b.classList.contains('done'))return;if(!selected){selected={x,b};b.classList.add('chosen');return}if(selected.x.side!==x.side&&selected.x.id===x.id){selected.b.classList.remove('chosen');selected.b.classList.add('done');b.classList.add('done');count++;say(x.id);selected=null;if(count===pairs.length){done=true;$('feedback').textContent='¡Todas las parejas encontradas!';$('feedback').className='feedback good';$('next').disabled=false}}else{selected.b.classList.remove('chosen');selected=null}};$('mg').appendChild(b)})}
function classifyTask(q){$('activity').innerHTML='<p class="hint">Marca todos los nombres que correspondan.</p><div class="options" id="sort"></div><button class="primary" id="checkSort" style="margin-top:12px">Comprobar</button>';let chosen=new Set();[...q.items].sort(()=>Math.random()-.5).forEach(w=>{let b=document.createElement('button');b.className='option';b.textContent=w;b.onclick=()=>{if(chosen.has(w)){chosen.delete(w);b.classList.remove('correct')}else{chosen.add(w);b.classList.add('correct')}};$('sort').appendChild(b)});$('checkSort').onclick=()=>{if(done)return;done=true;let ok=chosen.size===q.a.length&&q.a.every(x=>chosen.has(x));$('feedback').textContent=ok?'¡Correcto!':`Revisa la selección. Respuestas: ${q.a.join(', ')}.`;$('feedback').className='feedback '+(ok?'good':'bad');$('next').disabled=false}}
$('repeat').onclick=()=>{const q=qs[qi];if(q.s)say(q.s);else if(q.t==='match')say(q.pairs.map(x=>x[1]).join(', '))};$('next').onclick=()=>{if(qi<19){qi++;render()}else{$('qnum').textContent='¡Visita completada!';$('bar').style.width='100%';$('prompt').textContent='¡Has terminado At the Zoo!';$('visual').textContent='🦁 🐯 🐘 🦒 🐒 🦓 🐻';$('activity').innerHTML='<p>Has reconocido los siete animales salvajes y los has relacionado con imágenes y entornos.</p>';$('feedback').textContent='¡Buen trabajo!';$('next').disabled=true;$('repeat').disabled=true}};render();
</script></body></html>
