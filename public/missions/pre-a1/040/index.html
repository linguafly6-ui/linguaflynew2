inging."],"es":"I can sing expresa capacidad."},{"prompt":"Choose the correct verb after can.","answer":"jump","options":["jump","jumps","jumping"],"es":"El verbo después de can no lleva -s ni -ing."}]},"readingText":"This is a school talent day. Anna can sing and dance. Ben can run and jump, but he can't swim. Mia can swim very well. Tom can sing, but he can't fly. The children are happy. They show what they can do at the school show.","readingQuestions":[{"question":"What event is it?","answer":"A school talent day","options":["A school talent day","A birthday party","A sports lesson"]},{"question":"What can Anna do?","answer":"Sing and dance","options":["Sing and dance","Swim and fly","Run and sleep"]},{"question":"What can Ben do?","answer":"Run and jump","options":["Run and jump","Sing and fly","Swim and dance"]},{"question":"Can Ben swim?","answer":"No","options":["No","Yes","The text does not say"]},{"question":"Who can swim very well?","answer":"Mia","options":["Mia","Anna","Tom"]},{"question":"What can Tom do?","answer":"Sing","options":["Sing","Fly","Swim"]},{"question":"Can Tom fly?","answer":"No","options":["No","Yes","He can fly very well"]},{"question":"Where do the children show their abilities?","answer":"At the school show","options":["At the school show","At the café","At the beach"]},{"question":"How do the children feel?","answer":"Happy","options":["Happy","Angry","Sad"]},{"question":"What is the text about?","answer":"Things the children can do","options":["Things the children can do","Their favourite food","Their daily routine"]}],"listeningFormat":"Historia narrada","listeningScript":"Listen to the children at the park. Jack can run fast. He can jump, too. Lily can dance and sing. Sam can swim, but he can't fly. A bird can fly. The children look at the bird and smile. “Can you sing?” Jack asks Lily. “Yes, I can!” she says.","listeningQuestions":[{"question":"Where are the children?","answer":"At the park","options":["At the park","At the café","At school"]},{"question":"What can Jack do?","answer":"Run and jump","options":["Run and jump","Swim and fly","Dance and sing"]},{"question":"What can Lily do?","answer":"Dance and sing","options":["Dance and sing","Run and swim","Fly and jump"]},{"question":"Can Sam swim?","answer":"Yes","options":["Yes","No","The text does not say"]},{"question":"Can Sam fly?","answer":"No","options":["No","Yes","He flies with the bird"]},{"question":"Who can fly?","answer":"A bird","options":["A bird","Sam","Jack"]},{"question":"What does Jack ask Lily?","answer":"Can you sing?","options":["Can you sing?","Can you swim?","What time is it?"]},{"question":"What does Lily answer?","answer":"Yes, I can","options":["Yes, I can","No, I can't","Thank you"]},{"question":"What do the children do when they see the bird?","answer":"They smile","options":["They smile","They cry","They go home"]},{"question":"What grammar point is used?","answer":"Can and can't","options":["Can and can't","There is","I like"]}]};</script>
