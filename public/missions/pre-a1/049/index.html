ith Ella?","answer":"Mum","options":["Mum","Dad","Her teacher"]},{"question":"What can Ella see?","answer":"The sea","options":["The sea","A train","A supermarket"]},{"question":"What does Mum give Ella?","answer":"A bucket and spade","options":["A bucket and spade","A book and pen","A coat and hat"]},{"question":"What does Mum ask Ella to find?","answer":"A shell","options":["A shell","A flower","A coin"]},{"question":"Where is the shell?","answer":"In the sand","options":["In the sand","On the towel","In the sea"]},{"question":"What does Ella do with the shell?","answer":"Puts it in her bucket","options":["Puts it in her bucket","Throws it away","Gives it to a fish"]},{"question":"Where does Mum ask Ella to sit?","answer":"On the towel","options":["On the towel","In the bucket","On a rock"]},{"question":"What should they enjoy?","answer":"The sun","options":["The sun","The snow","The rain"]},{"question":"What place are they visiting?","answer":"The beach","options":["The beach","The park","The zoo"]},{"question":"Who gives the instructions?","answer":"Mum","options":["Mum","Ella","A lifeguard"]}]};</script>
