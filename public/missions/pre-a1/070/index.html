","Tired"]}],"listeningFormat":"Programa de radio","listeningScript":"Presenter: Welcome to the Pre-A1 Grand Adventure! Listen to our story. Tom is in the garden. There is a tree and there are three flowers. A small dog is next to the tree. It can jump. Tom likes dogs. He has got a blue ball. The ball is under the chair. Tom asks, “Where is my ball?” His sister says, “It is under the chair!” Well done, Tom. You can use your English!","listeningQuestions":[{"question":"What programme is this?","answer":"The Pre-A1 Grand Adventure","options":["The Pre-A1 Grand Adventure","The Weather Report","Party Time"]},{"question":"Where is Tom?","answer":"In the garden","options":["In the garden","In the classroom","At the beach"]},{"question":"What is in the garden?","answer":"A tree and three flowers","options":["A tree and three flowers","Two chairs and a sofa","A shop and a station"]},{"question":"Where is the dog?","answer":"Next to the tree","options":["Next to the tree","Under the chair","In the house"]},{"question":"What can the dog do?","answer":"Jump","options":["Jump","Fly","Swim"]},{"question":"What does Tom like?","answer":"Dogs","options":["Dogs","Cats","Birds"]},{"question":"What colour is Tom's ball?","answer":"Blue","options":["Blue","Red","Green"]},{"question":"Where is the ball?","answer":"Under the chair","options":["Under the chair","Next to the tree","In the bag"]},{"question":"Who tells Tom where the ball is?","answer":"His sister","options":["His sister","The presenter","His teacher"]},{"question":"Which structures are reviewed in the story?","answer":"Places, abilities, likes and possessions","options":["Places, abilities, likes and possessions","Only numbers and colours","Only greetings"]}]};</script>
