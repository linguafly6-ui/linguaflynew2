emonstrative.","answer":"Those","options":["Those","This","These"],"es":"Those se usa para varias cosas lejanas."}]},"readingText":"Look at the classroom table. This is my book. That is the teacher's book near the window. These are my pencils next to me. Those are the pencils on the shelf. I use this book and these pencils every day. The other things are far away.","readingQuestions":[{"question":"What is near the speaker?","answer":"Their book","options":["Their book","The teacher's book","The pencils on the shelf"]},{"question":"Where is the teacher's book?","answer":"Near the window","options":["Near the window","Next to the speaker","Under the table"]},{"question":"What are next to the speaker?","answer":"Their pencils","options":["Their pencils","The teacher's books","The bags"]},{"question":"Where are the other pencils?","answer":"On the shelf","options":["On the shelf","On the table","In the bag"]},{"question":"Which word does the speaker use for one close book?","answer":"This","options":["This","That","Those"]},{"question":"Which word does the speaker use for the far book?","answer":"That","options":["That","These","This"]},{"question":"Which demonstrative is used for close pencils?","answer":"These","options":["These","Those","That"]},{"question":"Which demonstrative is used for far pencils?","answer":"Those","options":["Those","This","These"]},{"question":"How many groups of pencils are mentioned?","answer":"Two","options":["Two","One","Three"]},{"question":"What does the speaker use every day?","answer":"This book and these pencils","options":["This book and these pencils","The teacher's book only","The shelf"]}],"listeningFormat":"Historia narrada","listeningScript":"Mum and Alex are in a shop. Alex points to a bag near him. “This is my bag,” he says. Then he points to a bag far away. “That is Dad's bag.” Mum shows him two hats near them. “These are nice hats.” Alex looks at two hats on a high shelf. “Those are nice too.” They choose a hat together.","listeningQuestions":[{"question":"Where are Mum and Alex?","answer":"In a shop","options":["In a shop","At school","At the beach"]},{"question":"Which bag is near Alex?","answer":"His bag","options":["His bag","Dad's bag","Mum's bag"]},{"question":"Where is Dad's bag?","answer":"Far away","options":["Far away","Near Alex","Under the table"]},{"question":"What does Mum show Alex?","answer":"Two hats","options":["Two hats","Two bags","Two books"]},{"question":"Where are the first two hats?","answer":"Near them","options":["Near them","On a high shelf","Outside the shop"]},{"question":"Where are the other hats?","answer":"On a high shelf","options":["On a high shelf","On the floor","In a bag"]},{"question":"Which word does Alex use for his nearby bag?","answer":"This","options":["This","Those","That"]},{"question":"Which word does Alex use for Dad's distant bag?","answer":"That","options":["That","These","This"]},{"question":"What do they choose?","answer":"A hat","options":["A hat","A bag","A book"]},{"question":"Who chooses together?","answer":"Mum and Alex","options":["Mum and Alex","Alex and Dad","Mum and Dad"]}]};</script>
