function quiz(sec,title,desc,prefix=""){const items=sec.exercise.items;let i=0,score=0;$("#content").innerHTML=shell(title,desc,prefix+'<div id="quiz"><p id="count" class="muted"></p><div class="progress"><div id="bar" class="bar"></div></div><p id="q" class="question"></p><div id="opts" class="options"></div><p id="fb" class="feedback"></p><button class="primary" id="next" disabled>Siguiente →</button></div>');function show(){const x=items[i];$("#count").textContent="Reto "+(i+1)+" de "+items.length+" · Aciertos: "+score;$("#bar").style.width=(i/items.length*100)+"%";$("#q").textContent=x.prompt;$("#opts").innerHTML=x.options.map(o=>'<button>'+esc(o)+'</button>').join("");$("#fb").textContent="";$("#next").disabled=true;$("#opts").querySelectorAll("button").forEach(b=>b.onclick=async()=>{document.querySelectorAll("#opts button").forEach(z=>z.disabled=true);try{const r=await check(x.itemId,b.textContent);if(r.correct)score++;$("#fb").textContent=r.feedback+(r.correct?"":" · Solución: "+r.solution);$("#next").disabled=false}catch(e){$("#fb").textContent=e.message}})}$("#next").onclick=()=>{if(++i<items.length)show();else $("#quiz").innerHTML='<h3>Resultado: '+score+' / '+items.length+'</h3><button onclick="location.reload()">Repetir</button>'};show()}

else if(sec.sectionKey==="speaking"){let i=0;$("#content").innerHTML=shell("Speaking · 10 prompts","Graba tu voz y recibe transcripción y feedback. La coincidencia textual no es una nota fonética.",'<div id="speaking"></div>');function show(){const x=e.items[i];$("#speaking").innerHTML='<div class="card"><p>Prompt '+(i+1)+' de 10</p><h3>'+esc(x.prompt)+'</h3><p><b>Modelo:</b> '+esc(x.modelAnswer)+'</p><button class="audio" id="model">Escuchar modelo</button><button class="primary" id="record">Grabar</button><button id="stop" disabled>Detener y analizar</button><p id="fb" class="feedback"></p><button id="next">Siguiente prompt</button></div>';$("#model").onclick=()=>speak(x.modelAnswer);$("#record").onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=ev=>{if(ev.data.size)chunks.push(ev.data)};recorder.onstop=async()=>{const fd=new FormData();fd.append("audio",new Blob(chunks,{type:recorder.mimeType||"audio/webm"}),"speaking.webm");fd.append("targetPhrase",x.modelAnswer);fd.append("language","en");fd.append("phraseId",x.itemId);const res=await fetch("/api/pronunciation/analyze",{method:"POST",body:fd}),d=await res.json();$("#fb").textContent=d.error||("Transcripción: "+(d.transcription||"No reconocida")+". "+d.feedback+" "+d.scoreLabel);stream.getTracks().forEach(t=>t.stop())};recorder.start();$("#record").disabled=true;$("#stop").disabled=false}catch(err){$("#fb").textContent="No se pudo acceder al micrófono."}};$("#stop").onclick=()=>{if(recorder&&recorder.state!=="inactive")recorder.stop();$("#stop").disabled=true};$("#next").onclick=()=>{if(++i<10)show();else $("#speaking").innerHTML="<h3>Has completado los diez prompts.</h3>"}}show()}
else{const c=e.content;let slots={},selected=null;const bank=[...c.wordBank].sort(()=>Math.random()-.5),labels=Object.fromEntries(c.wordBank.map(w=>[w.wordId,w.word]));$("#content").innerHTML=shell("Listening · Escucha y completa","Audio británico, diez huecos inline y banco de diez palabras. Puedes mover y sustituir respuestas.",'<div class="card"><button class="audio" id="play">▶ Escuchar audio</button><button id="stop">Detener</button></div><article class="passage" id="text"></article><h3>Banco de palabras</h3><div class="bank" id="bank"></div><p id="status" class="feedback"></p><button class="primary" id="check">Comprobar respuestas</button><button id="reset">Reiniciar</button><p id="result" class="feedback"></p>');function paint(){let t=c.transcriptTemplate;for(let n=1;n<=10;n++){const token="[[gap-"+String(n).padStart(2,"0")+"]]";t=t.replace(token,'<button class="gap '+(slots[n]?"filled":"")+'" data-gap="'+n+'">'+(slots[n]?esc(labels[slots[n]]):"Hueco "+n)+'</button>')}$("#text").innerHTML=t;$("#bank").innerHTML=bank.map(w=>'<button class="word" data-word="'+w.wordId+'" '+(Object.values(slots).includes(w.wordId)?"hidden":"")+'>'+esc(w.word)+'</button>').join("");$("#status").textContent=Object.keys(slots).length+" de 10 huecos completados"+(selected?" · seleccionada: "+labels[selected]:"")}paint();$("#bank").onclick=ev=>{const b=ev.target.closest("[data-word]");if(b){selected=b.dataset.word;paint()}};$("#text").onclick=ev=>{const b=ev.target.closest("[data-gap]");if(!b)return;const n=+b.dataset.gap;if(selected){slots[n]=selected;selected=null;paint()}else if(slots[n]){selected=slots[n];delete slots[n];paint()}};$("#play").onclick=()=>speak(c.audio.replace("tts:en-GB:",""));$("#stop").onclick=()=>speechSynthesis.cancel();$("#check").onclick=async()=>{let score=0,lines=[];for(let n=1;n<=10;n++){const x=e.items[n-1],r=await check(x.itemId,slots[n]||"");if(r.correct)score++;lines.push(n+". "+(r.correct?"✓":"✗ "+r.solution))}$("#result").textContent="Puntuación: "+score+" / 10 · Soluciones: "+lines.join(" | ")};$("#reset").onclick=()=>{slots={};selected=null;paint();$("#result").textContent=""}}
