else{const c=e.content;let slots={},selected=null;const bank=[...c.wordBank].sort(()=>Math.random()-.5),labels=Object.fromEntries(c.wordBank.map(w=>[w.wordId,w.word]));$("#content").innerHTML=shell("Listening · Escucha y completa","Audio británico, diez huecos inline y banco de diez palabras. Puedes mover y sustituir respuestas.",'<div class="card"><button class="audio" id="play">▶ Escuchar audio</button><button id="stop">Detener</button></div><article class="passage" id="text"></article><h3>Banco de palabras</h3><div class="bank" id="bank"></div><p id="status" class="feedback"></p><button class="primary" id="check">Comprobar respuestas</button><button id="reset">Reiniciar</button><p id="result" class="feedback"></p>');function paint(){let t=c.transcriptTemplate;for(let n=1;n<=10;n++){const token="[[gap-"+String(n).padStart(2,"0")+"]]";t=t.replace(token,'<button class="gap '+(slots[n]?"filled":"")+'" data-gap="'+n+'">'+(slots[n]?esc(labels[slots[n]]):"Hueco "+n)+'</button>')}$("#text").innerHTML=t;$("#bank").innerHTML=bank.map(w=>'<button class="word" data-word="'+w.wordId+'" '+(Object.values(slots).includes(w.wordId)?"hidden":"")+'>'+esc(w.word)+'</button>').join("");$("#status").textContent=Object.keys(slots).length+" de 10 huecos completados"+(selected?" · seleccionada: "+labels[selected]:"")}paint();$("#bank").onclick=ev=>{const b=ev.target.closest("[data-word]");if(b){selected=b.dataset.word;paint()}};$("#text").onclick=ev=>{const b=ev.target.closest("[data-gap]");if(!b)return;const n=+b.dataset.gap;if(selected){slots[n]=selected;selected=null;paint()}else if(slots[n]){selected=slots[n];delete slots[n];paint()}};$("#play").onclick=()=>speak(c.audio.replace("tts:en-GB:",""));$("#stop").onclick=()=>speechSynthesis.cancel();$("#check").onclick=async()=>{let score=0,lines=[];for(let n=1;n<=10;n++){const x=e.items[n-1],r=await check(x.itemId,slots[n]||"");if(r.correct)score++;lines.push(n+". "+(r.correct?"✓":"✗ "+r.solution))}$("#result").textContent="Puntuación: "+
