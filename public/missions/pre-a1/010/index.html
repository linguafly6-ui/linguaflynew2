$("#p-explore").innerHTML='<h2>Exploración · Vocabulary</h2><p>'+esc(ex("explore").theory.explanation)+'</p><div class="grid">'+ex("explore").items.map(x=>'<article class="card"><b class="word">'+esc(x.english)+'</b> <button data-say="'+esc(x.english)+'">🔊</button><p class="translation">'+esc(x.spanish)+'</p></article>').join("")+'</div><h3>'+esc(ex("explore").theory.title)+'</h3>'+ex("explore").theory.patterns.map(x=>'<article class="card"><b>'+esc(x.label)+'</b><p>'+esc(x.pattern)+'</p>'+x.examples.map(esc).join(" · ")+'</article>').join("")+'<p class="hint">'+esc(ex("explore").theory.tip)+'</p>';
function quiz(k,title){const e=ex(k),p=$("#p-"+k);p.innerHTML='<h2>'+title+'</h2><div id="'+k+'-q"></div><p class="feedback" id="'+k+'-score"></p>';let score=0;const root=$("#"+k+"-q");root.innerHTML=e.items.map(x=>'<article class="question" data-id="'+x.itemId+'"><b>'+x.position+'. '+esc(x.prompt)+'</b><div class="options">'+x.options.map(o=>'<button data-a="'+esc(o)+'">'+esc(o)+'</button>').join("")+'</div><p class="feedback"></p></article>').join("");root.onclick=async ev=>{const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;const c=b.closest("[data-id]");c.querySelectorAll("button").forEach(x=>x.disabled=true);try{const r=await check(c.dataset.id,b.dataset.a);if(r.correct)score++;c.querySelector(".feedback").textContent=r.feedback+(r.correct?"":" · Solución: "+r.solution);$("#"+k+"-score").textContent="Aciertos: "+score+" / "+e.items.length}catch(err){c.querySelector(".feedback").textContent=err.message;c.querySelectorAll("button").forEach(x=>x.disabled=false)}}}
quiz("practice","Practice · 20 retos");quiz("grammar","Grammar · 10 ejercicios");
$("#p-pronunciation").innerHTML='<h2>Pronunciation</h2><p>Escucha el modelo británico y repite. La guía «Suena como» es una aproximación pensada para hispanohablantes, no una transcripción fonética exacta.</p><div class="grid">'+ex("pronunciation").items.map(x=>'<article class="card"><b class="word">'+esc(x.word)+'</b> <button data-say="'+esc(x.word)+'">🔊 Escuchar</button><p>'+esc(x.translation)+'</p><p class="hint">Guía para hispanohablantes · Suena como: '+esc(x.pronunciationGuide)+'</p></article>').join("")+'</div>';
const re=ex("reading");$("#p-reading").innerHTML='<h2>Reading</h2><article class="passage" lang="en">'+esc(re.content.passage)+'</article><p>Lee el pasaje completo antes de responder.</p><div id="read-q"></div><p id="read-score" class="feedback"></p>';let rs=0;$("#read-q").innerHTML=re.items.map(x=>'<article class="question" data-id="'+x.itemId+'"><b>'+x.position+'. '+esc(x.prompt)+'</b><div class="options">'+x.options.map(o=>'<button data-a="'+esc(o)+'">'+esc(o)+'</button>').join("")+'</div><p class="feedback"></p></article>').join("");$("#read-q").onclick=async ev=>{const b=ev.target.closest("[data-a]");if(!b||b.disabled)return;const c=b.closest("[data-id]");c.querySelectorAll("button").forEach(x=>x.disabled=true);try{const r=await check(c.dataset.id,b.dataset.a);if(r.correct)rs++;c.querySelector(".feedback").textContent=r.feedback+(r.correct?"":" · Solución: "+r.solution);$("#read-score").textContent="Aciertos: "+rs+" / 10"}catch(err){c.querySelector(".feedback").textContent=err.message;c.querySelectorAll("button").forEach(x=>x.disabled=false)}};
const we=ex("writing");let wi=0,ws=0;function writeShow(){const x=we.items[wi];$("#p-writing").innerHTML='<h2>Writing · Dictation</h2><article class="card"><p>Dictado '+(wi+1)+' de 10</p><button id="w-play">🔊 Escuchar</button><p><input id="w-answer" class="field" placeholder="Escribe lo que escuchas"></p><button class="primary" id="w-check">Comprobar</button><p id="w-feedback" class="feedback"></p></article>';$("#w-play").onclick=()=>say(x.audio.replace("tts:en-GB:",""));$("#w-check").onclick=async()=>{const b=$("#w-check");b.disabled=true;try{const r=await check(x.itemId,$("#w-answer").value);if(r.correct)ws++;$("#w-feedback").textContent=r.feedback+(r.correct?"":" · Solución: "+r.solution);const n=document.createElement("button");n.textContent=wi===9?"Resultado":"Siguiente";n.onclick=()=>{if(++wi<10)writeShow();else $("#p-writing").innerHTML="<h2>Writing completado</h2><h3>Resultado: "+ws+" / 10</h3>"};$("#w-feedback").after(n)}catch(err){$("#w-feedback").textContent=err.message;b.disabled=false}}}writeShow();
const se=ex("speaking");let si=0,rec,stream,chunks=[];function speakShow(){const x=se.items[si];$("#p-speaking").innerHTML='<h2>Speaking</h2><p>La transcripción ayuda a comprobar el reconocimiento, pero no es una evaluación fonética.</p><article class="card"><p>Prompt '+(si+1)+' de 10</p><h3>'+esc(x.prompt)+'</h3><p><b>Modelo:</b> '+esc(x.modelAnswer)+'</p><div class="row"><button id="s-model">🔊 Modelo</button><button class="primary" id="s-rec">Grabar</button><button id="s-stop" disabled>Detener y analizar</button></div><p id="s-feedback" class="feedback"></p><button id="s-next">Siguiente prompt</button></article>';$("#s-model").onclick=()=>say(x.modelAnswer);$("#s-rec").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const fd=new FormData();fd.append("audio",new Blob(chunks,{type:rec.mimeType||"audio/webm"}),"speaking.webm");fd.append("targetPhrase",x.modelAnswer);fd.append("language","en");fd.append("phraseId",x.itemId);const r=await fetch("/api/pronunciation/analyze",{method:"POST",body:fd}),d=await r.json();$("#s-feedback").textContent=d.error||"Transcripción: "+(d.transcription||"No reconocida")+". No representa una nota fonética."};rec.start();$("#s-rec").disabled=true;$("#s-stop").disabled=false}catch(err){$("#s-feedback").textContent="No se pudo acceder al micrófono: "+err.message}};$("#s-stop").onclick=()=>{if(rec&&rec.state!=="inactive")rec.stop();$("#s-stop").disabled=true};$("#s-next").onclick=()=>{if(++si<10)speakShow();else $("#p-speaking").innerHTML="<h2>Has completado los diez prompts.</h2>"}}speakShow();
const le=ex("listening"),lc=le.content,labels=Object.fromEntries(lc.wordBank.map(w=>[w.wordId,w.word]));let slots={},selected=null,words=[...lc.wordBank].sort(()=>Math.random()-.5);function listenPaint(){let t=lc.transcriptTemplate;for(let n=1;n<=10;n++){const token="[[gap-"+String(n).padStart(2,"0")+"]]";t=t.replace(token,'<button class="gap '+(slots[n]?"filled":"")+'" data-gap="'+n+'">'+(slots[n]?esc(labels[slots[n]]):"Hueco "+n)+'</button>')}$("#listen-text").innerHTML=t;$("#listen-bank").innerHTML=words.map(w=>'<button data-word="'+w.wordId+'" '+(Object.values(slots).includes(w.wordId)?"disabled":"")+'>'+esc(w.word)+'</button>').join("");$("#listen-status").textContent=Object.keys(slots).length+" de 10 huecos completados"+(selected?" · seleccionada: "+labels[selected]:"")}
$("#p-listening").innerHTML='<h2>Listening · Escucha y completa</h2><div class="row"><button id="l-play">▶ Escuchar audio</button><button id="l-stop">Detener</button></div><article class="passage" id="listen-text" lang="en"></article><h3>Banco de palabras</h3><div class="bank" id="listen-bank"></div><p id="listen-status" class="feedback"></p><div class="row"><button class="primary" id="l-check">Corregir</button><button id="l-reset">Reiniciar</button></div><p id="l-result" class="feedback"></p>';listenPaint();$("#l-play").onclick=()=>say(lc.audio.replace("tts:en-GB:",""));$("#l-stop").onclick=()=>speechSynthesis.cancel();$("#listen-bank").onclick=e=>{const b=e.target.closest("[data-word]");if(b&&!b.disabled){selected=b.dataset.word;listenPaint()}};$("#listen-text").onclick=e=>{const b=e.target.closest("[data-gap]");if(!b)return;const n=+b.dataset.gap;if(selected){slots[n]=selected;selected=null;$("#l-result").textContent="";listenPaint()}else if(slots[n]){selected=slots[n];delete slots[n];listenPaint()}};$("#l-check").onclick=async()=>{if(Object.keys(slots).length!==10){$("#l-result").textContent="Completa los diez huecos antes de corregir.";return}let score=0,solutions=[];for(let n=1;n<=10;n++){const r=await check(le.items[n-1].itemId,labels[slots[n]]);if(r.correct)score++;solutions.push(r.solution)}$("#l-result").textContent="Puntuación: "+score+" / 10 · Soluciones: "+solutions.join(" · ")};$("#l-reset").onclick=()=>{slots={};selected=null;$("#l-result").textContent="";listenPaint()};
document.addEventListener("click",e=>{const b=e.target.closest("[data-say]");if(b)say(b.dataset.say)});
</script></body></html>
