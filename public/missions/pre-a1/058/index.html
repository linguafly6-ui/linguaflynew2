lish. Listen to the teacher. “Good morning, class. Stand up. Sit down. Open your books. Look at the board. Listen to me. Repeat: hello. Now read the sentence and write your name. Close your books. Thank you, class!” Presenter: These are useful instructions for English class.","listeningQuestions":[{"question":"What is the programme called?","answer":"Classroom English","options":["Classroom English","Party Time","The Weather Report"]},{"question":"Who gives the instructions?","answer":"The teacher","options":["The teacher","A shop worker","A farmer"]},{"question":"What does the teacher ask the class to do first?","answer":"Stand up","options":["Stand up","Close the books","Write a name"]},{"question":"What must the pupils open?","answer":"Their books","options":["Their books","The windows","The door"]},{"question":"Where must the pupils look?","answer":"At the board","options":["At the board","At the floor","At the clock"]},{"question":"What must the class repeat?","answer":"Hello","options":["Hello","Goodbye","Thank you"]},{"question":"What must pupils read?","answer":"A sentence","options":["A sentence","A menu","A map"]},{"question":"What must they write?","answer":"Their name","options":["Their name","A story","A number"]},{"question":"What must they close?","answer":"Their books","options":["Their books","Their bags","The classroom"]},{"question":"What are these phrases?","answer":"Classroom instructions","options":["Classroom instructions","Shopping questions","Animal names"]}]};</script>
