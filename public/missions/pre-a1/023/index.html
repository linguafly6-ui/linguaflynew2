ear “quack”. Which animal is it?","answer":"A duck","options":["A duck","A horse","A sheep"],"es":"Quack es el sonido que se asocia al pato en esta misión."}]},"readingText":"At the farm, Lily hears a sound. “Moo!” It is a cow. Then she hears “quack, quack!” It is a duck. A sheep is near the gate. A horse is in the field. A pig is by the tree and a chicken is near the barn. Lily asks, “What is it?” and names each animal.","readingQuestions":[{"question":"Where is Lily?","answer":"At the farm","options":["At the farm","At the zoo","At the café"]},{"question":"Which animal says “moo”?","answer":"A cow","options":["A cow","A duck","A pig"]},{"question":"Which animal says “quack”?","answer":"A duck","options":["A duck","A sheep","A horse"]},{"question":"Which animal is near the gate?","answer":"A sheep","options":["A sheep","A chicken","A cow"]},{"question":"Where is the horse?","answer":"In the field","options":["In the field","By the tree","Near the barn"]},{"question":"Which animal is by the tree?","answer":"A pig","options":["A pig","A duck","A horse"]},{"question":"Which animal is near the barn?","answer":"A chicken","options":["A chicken","A sheep","A cow"]},{"question":"What question does Lily ask?","answer":"What is it?","options":["What is it?","Where is it?","How are you?"]},{"question":"Which animal makes a sound twice in the text?","answer":"The duck","options":["The duck","The horse","The chicken"]},{"question":"What is Lily doing?","answer":"Naming animals","options":["Naming animals","Buying food","Feeding a fish"]}],"listeningFormat":"Entrevista","listeningScript":"Host: We are at the farm with Alex. Alex, what can you hear? Alex: Moo! Host: What is it? Alex: It is a cow. Host: And now? Alex: Quack, quack! It is a duck. Host: Can you hear the sheep? Alex: Yes. Baa! Host: What about the horse? Alex: The horse is next to the field. Host: Thank you, Alex!","listeningQuestions":[{"question":"Who is at the farm with the host?","answer":"Alex","options":["Alex
