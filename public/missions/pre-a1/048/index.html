<script>window.LINGUAFLY_MISSION={"id":"048","title":"In the Garden","theme":"Plantas y jardinería","description":"Identifica plantas y acciones sencillas para cuidar un jardín.","words":[["tree","árbol","🌳"],["flower","flor","🌼"],["grass","césped","🌱"],["seed","semilla","🌰"],["leaf","hoja","🍃"],["water","regar / agua","💧"],["grow","crecer","🌿"]],"extraVocabulary":[],"pronunciation":[{"word":"tree","activity":"Escuchar el sonido inicial y repetir","hint":"tríi"},{"word":"flower","activity":"Practicar las vocales y repetir","hint":"fláua"},{"word":"grass","activity":"Marcar el sonido inicial y repetir","hint":"gráas"},{"word":"seed","activity":"Escuchar el sonido final y repetir","hint":"síid"},{"word":"leaf","activity":"Escuchar el sonido inicial y repetir","hint":"líif"},{"word":"water","activity":"Practicar las vocales y repetir","hint":"uó-ta"},{"word":"grow","activity":"Marcar las sílabas al decir la palabra","hint":"gróu"}],"grammar":{"focus":"Imperativos y verbos de naturaleza en presente simple","explanation":"Usamos el imperativo para dar una instrucción: «Water the flower». Para contar algo que ocurre en la naturaleza, usamos una frase sencilla: «Seeds grow». En esta misión practicamos acciones cortas del jardín.","model":"Water the flower. Seeds grow.","practice":"Relaciona cada instrucción con la imagen y completa una frase sobre las plantas.","order":"Water the flower.","final":["Water the flower.","Waters the flower.","Watering the flower."],"items":[{"prompt":"Choose the correct garden instruction.","answer":"Water the flower.","options":["Water the flower.","Waters the flower.","Watering the flower."],"es":"El imperativo usa el verbo base water."},{"prompt":"Complete: Seeds ___.","answer":"grow","options":["grow","grows","growing"],"es":"La frase modelo del currículo es Seeds grow."},{"prompt":"Which word means “semilla”?","answer":"seed","options":["seed","leaf","grass"],"es":"Seed significa semilla."},{"prompt":"Choose the correct word for the green
