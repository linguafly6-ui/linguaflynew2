hrase.","answer":"her toy","options":["her toy","his toy","your toy"],"es":"Her indica que el juguete pertenece a ella."}]},"readingText":"This is Ben's school bag. His book is blue and his pencil is green. Mia has a red bag. Her book is small. “This is my toy,” says Ben. Mia points to her doll and says, “This is my toy.” The children put their things on the table.","readingQuestions":[{"question":"Whose school bag is blue?","answer":"Ben's","options":["Ben's","Mia's","The teacher's"]},{"question":"What colour is Ben's book?","answer":"Blue","options":["Blue","Green","Red"]},{"question":"What colour is Ben's pencil?","answer":"Green","options":["Green","Blue","Yellow"]},{"question":"What colour is Mia's bag?","answer":"Red","options":["Red","Blue","Green"]},{"question":"What is small?","answer":"Mia's book","options":["Mia's book","Ben's book","Ben's pencil"]},{"question":"What does Ben call his toy?","answer":"My toy","options":["My toy","Her toy","Your toy"]},{"question":"What does Mia point to?","answer":"Her doll","options":["Her doll","His book","A pencil"]},{"question":"Where do the children put their things?","answer":"On the table","options":["On the table","Under the bed","In the garden"]},{"question":"Which possessive shows that something belongs to Ben?","answer":"His","options":["His","Her","Your"]},{"question":"Which possessive shows that something belongs to Mia?","answer":"Her","options":["Her","His","My"]}],"listeningFormat":"Situación dramatizada","listeningScript":"Teacher: Is this your bag, Ben? Ben: Yes, it is my bag. Teacher: And is this your book? Ben: No, it is her book. It is Mia's. Mia: This is my pencil. Teacher: And what is that? Mia: It is his toy. Teacher: Very good. Put your things on the table, please.","listeningQuestions":[{"question":"Who speaks to Ben and Mia?","answer":"The teacher","options":["The teacher","Their mother","A shop worker"]},{"question":"Whose bag is it?","answer":"Ben's","options":["Ben's","Mia's","The teacher's"]},{"question":"What does Ben say about the bag?","answer":"It is my bag","options":["It is my bag","It is her bag","It is your bag"]},{"question":"Whose book is it?","answer":"Mia's","options":["Mia's","Ben's","The teacher's"]},{"question":"What does Mia say is hers?","answer":"Her pencil","options":["Her pencil","Her bag","Her book"]},{"question":"Whose toy is it?","answer":"Ben's","options":["Ben's","Mia's","The teacher's"]},{"question":"Which possessive does Ben use for his bag?","answer":"My","options":["My","Your","Her"]},{"question":"Which possessive does the teacher use when speaking to Ben?","answer":"Your","options":["Your","His","My"]},{"question":"Where must they put their things?","answer":"On the table","options":["On the table","Under the chair","In the bag"]},{"question":"What is the conversation about?","answer":"Who owns classroom things","options":["Who owns classroom things","The weather","A sports game"]}]};</script>
