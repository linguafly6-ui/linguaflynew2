ado o enfadada."}]},"readingText":"It is a hot day. Emma is thirsty, so she drinks water. Her brother Ben is hungry. He eats a sandwich. Their friend Lucy is tired after the game. Mum is happy because the children are home. The dog is sad because it wants to play. Everyone has a different feeling.","readingQuestions":[{"question":"What is the weather like?","answer":"Hot","options":["Hot","Cold","Rainy"]},{"question":"Who is thirsty?","answer":"Emma","options":["Emma","Ben","Lucy"]},{"question":"What does Emma drink?","answer":"Water","options":["Water","Milk","Juice"]},{"question":"Who is hungry?","answer":"Ben","options":["Ben","Emma","Mum"]},{"question":"What does Ben eat?","answer":"A sandwich","options":["A sandwich","An apple","A cake"]},{"question":"Why is Lucy tired?","answer":"After the game","options":["After the game","After a long trip","Because she is hungry"]},{"question":"Who is happy?","answer":"Mum","options":["Mum","The dog","Ben"]},{"question":"Why is the dog sad?","answer":"It wants to play","options":["It wants to play","It wants water","It is cold"]},{"question":"Do all the people have the same feeling?","answer":"No","options":["No","Yes","The text does not say"]},{"question":"What is the text about?","answer":"Feelings and needs","options":["Feelings and needs","A shopping list","A school timetable"]}],"listeningFormat":"Entrevista","listeningScript":"Interviewer: Hello, Tom. How are you today? Tom: I am happy. Interviewer: Is your sister happy too? Tom: No, she is tired. Interviewer: And your brother? Tom: He is hungry. Interviewer: What about your mum? Tom: She is thirsty. She wants water. Interviewer: Thank you, Tom.","listeningQuestions":[{"question":"Who is being interviewed?","answer":"Tom","options":["Tom","Ben","Leo"]},{"question":"How does Tom feel?","answer":"Happy","options":["Happy","Sad","Angry"]},{"question":"How does Tom's sister feel?","answer":"Tired","options":["Tired","Thirsty","Hungry"]},{"question":"Who is hungry?","answe
